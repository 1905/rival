{
  "name": "executor-grok-failure",
  "description": "`rival command grok` raw prompt whose provider exits 1. runModelCommand prints the log on stdout, fails the session with 'grok exited with code 1' (review.RunTimeoutReason fallback, no deadline), and cmd/root.go Execute prints the ExitCodeError on stderr. Exact argv/env from internal/executor/grok.go RunGrokModel/grokRunArgs/GrokEffort, GrokPreflight.",
  "fakes": {
    "scripts": {
      "grok": {
        "responses": [
          {
            "argv": [
              "--prompt-file",
              {
                "$regex": "<ROOT>/tmp/rival-grok-[0-9]+\\.md"
              },
              "-m",
              "grok-4.6",
              "--effort",
              "high",
              "--output-format",
              "plain",
              "--no-auto-update",
              "--yolo",
              "--cwd",
              "<ROOT>/work"
            ],
            "times": 1,
            "expect": {
              "stdin": "",
              "cwd": "<ROOT>/work"
            },
            "stdout": "boom\n",
            "exit": 1
          }
        ]
      }
    }
  },
  "fixtures": [
    {
      "write": "home/.grok/auth.json",
      "text": "{}\n",
      "mode": "0600"
    }
  ],
  "steps": [
    {
      "run": [
        "command",
        "grok"
      ],
      "stdin": "explain the auth flow",
      "expect": {
        "exit_code": 1,
        "stdout": "boom\n",
        "stderr_lines": [
          "grok exited with code 1"
        ],
        "log_events": [
          {
            "level": "info",
            "message": "starting grok (command mode)",
            "fields": {
              "session": "<UUID1>",
              "effort": "high",
              "mode": "raw"
            }
          }
        ]
      }
    }
  ],
  "expect": {
    "home_files": [
      ".grok/auth.json",
      ".rival/queue/.lock",
      ".rival/sessions/<UUID1>.json",
      ".rival/sessions/<UUID1>.log"
    ],
    "files": [
      {
        "path": "<HOME>/.rival/sessions/<UUID1>.json",
        "json": {
          "status": "failed",
          "exit_code": 1,
          "cli": "grok",
          "model": "grok-4.6",
          "effort": "high",
          "mode": "raw",
          "work_dir": "<ROOT>/work",
          "error": "grok exited with code 1"
        }
      },
      {
        "path": "<HOME>/.rival/sessions/<UUID1>.log",
        "text": "boom\n"
      }
    ],
    "calls": {
      "grok": 1
    }
  }
}
