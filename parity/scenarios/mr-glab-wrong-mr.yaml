{
  "name": "mr-glab-wrong-mr",
  "description": "`rival command codex` with `review <MR-URL>` on stdin (cmd/model_command.go runModelCommand: ParseCodexArgs -> IsReview, resolveEffort, CodexPreflightFor runs `codex login status`, then prepareReview -> cmd/merge_request.go prepareReviewTarget -> mergerequest.Prepare). matchingRemote finds origin (git remote, git remote get-url origin; remoteIdentity matches gitlab.example.com + group/sub/app), then glab api --hostname gitlab.example.com projects/group%2Fsub%2Fapp/merge_requests/42 runs in the caller workdir with apiEnv (global GitLab token/host vars and DEBUG removed, GIT_TERMINAL_PROMPT=0, GLAB_CHECK_UPDATE=false). The response iid is 43, so `mr.IID != t.IID` refuses the review. No checkout, session or queue work happens; cmd/root.go Execute prints the error on stderr and exits 1.",
  "fakes": {
    "scripts": {
      "codex": {
        "responses": [
          {
            "argv": [
              "login",
              "status"
            ],
            "times": 1,
            "stdout": "Logged in using ChatGPT\n",
            "exit": 0
          }
        ]
      },
      "glab": {
        "responses": [
          {
            "argv": [
              "api",
              "--hostname",
              "gitlab.example.com",
              "projects/group%2Fsub%2Fapp/merge_requests/42"
            ],
            "times": 1,
            "expect": {
              "cwd": "<ROOT>/work",
              "env": {
                "GITLAB_TOKEN": null,
                "GITLAB_ACCESS_TOKEN": null,
                "OAUTH_TOKEN": null,
                "CI_JOB_TOKEN": null,
                "GITLAB_HOST": null,
                "GITLAB_URI": null,
                "GL_HOST": null,
                "DEBUG": null,
                "GIT_TERMINAL_PROMPT": "0",
                "GLAB_CHECK_UPDATE": "false"
              }
            },
            "stdout": "{\"iid\":43,\"web_url\":\"https://gitlab.example.com/group/sub/app/-/merge_requests/42\",\"sha\":\"86d7da21d369a2c43beaa522ec02d864c0250a3d\",\"source_branch\":\"feature\",\"target_branch\":\"main\",\"diff_refs\":{\"base_sha\":\"090479deb9ac7429fee542c439eadf972316cb84\",\"head_sha\":\"86d7da21d369a2c43beaa522ec02d864c0250a3d\"}}\n",
            "exit": 0
          }
        ]
      }
    }
  },
  "env": {
    "GITLAB_TOKEN": "wrong-host-token",
    "GITLAB_ACCESS_TOKEN": "wrong-host-token",
    "OAUTH_TOKEN": "wrong-host-token",
    "CI_JOB_TOKEN": "wrong-host-token",
    "GITLAB_HOST": "other.example.com",
    "GITLAB_URI": "https://other.example.com",
    "GL_HOST": "other.example.com",
    "DEBUG": "1"
  },
  "fixtures": [
    {
      "git": "work",
      "args": [
        "init",
        "-q"
      ]
    },
    {
      "git": "work",
      "args": [
        "remote",
        "add",
        "origin",
        "https://gitlab.example.com/group/sub/app.git"
      ]
    }
  ],
  "steps": [
    {
      "run": [
        "command",
        "codex"
      ],
      "stdin": "review https://gitlab.example.com/group/sub/app/-/merge_requests/42",
      "expect": {
        "exit_code": 1,
        "stdout": "",
        "stderr_lines": [
          "GitLab response does not identify the requested MR; refusing to review"
        ],
        "log_events": []
      }
    }
  ],
  "expect": {
    "home_files": [],
    "calls": {
      "codex": 1,
      "glab": 1
    }
  }
}
