{
  "name": "queue-contention",
  "description": "Two `rival run claude --prompt-stdin` runs with RIVAL_MAX_CONCURRENT=1. A is promoted on an empty queue (internal/queue/queue.go WaitForSlot: idx 0 < 1-0) and holds the slot inside the fake claude. `rival queue` (cmd/queue.go queueListAction) lists A's running ticket: Position 0 prints '-', mode is the WaitForGroupSlot mode 'raw', PID is A's rival pid, WAIT is now-StartedAt. B (RIVAL_QUEUE_TIMEOUT=1s) is not promoted (idx 0 < 1-1 is false); onPosition fires once (internal/review/slots.go: 'rival queue: position %d/%d (%d running), waiting %s', time.Since(start).Round(time.Second), normalised), the 2s QueuePollInterval sleep passes the 1s deadline, the next pass returns ErrQueueTimeout, slots.go releases the ticket, fails the session with the timeout message, and cmd/root.go Execute prints the error and exits 1. `queue clear --force` (Clear(true)) then removes A's live running ticket ('Removed 1 ticket.'); A keeps running and its Release ignores the missing file (os.IsNotExist). A completes raw mode: stdout is the live mirror of the fake output (cmd/model_run.go), no 'slot acquired' line because it waited < 1s. B never reaches the provider, so it has no .log file. Normalisation: the PID column (with its %-7d padding) is a pid marker, so <PID1> is A's rival pid and must equal owner_pid in A's session; WAIT (with its %-9s padding) and the progress 'waiting' value are durations.",
  "timeout": 120,
  "env": {
    "RIVAL_MAX_CONCURRENT": "1"
  },
  "fixtures": [
    {
      "mkdir": "sync"
    }
  ],
  "fakes": {
    "scripts": {
      "claude": {
        "responses": [
          {
            "argv_prefix": [
              "-p"
            ],
            "times": 1,
            "expect": {
              "stdin": {
                "$regex": "(?s).*\\nfirst"
              }
            },
            "touch": "<ROOT>/sync/a-running",
            "wait_for": "<ROOT>/sync/go",
            "wait_timeout": 60,
            "stdout": "A done\n",
            "exit": 0
          }
        ]
      }
    }
  },
  "normalise": [
    {
      "regex": "running   raw           (\\d+ *)  \\S",
      "kind": "pid"
    },
    {
      "regex": "<PID\\d+>  (\\S+ *)  <ROOT>/work",
      "kind": "duration"
    },
    {
      "regex": "\\(\\d+ running\\), waiting (\\S+)",
      "kind": "duration"
    }
  ],
  "steps": [
    {
      "start": "a",
      "run": [
        "run",
        "claude",
        "--prompt-stdin"
      ],
      "stdin": "first"
    },
    {
      "wait_file": "sync/a-running",
      "timeout": 30
    },
    {
      "run": [
        "queue"
      ],
      "expect": {
        "exit_code": 0,
        "stdout": "POS   STATE     MODE          PID      WAIT       WORKDIR\n-     running   raw           <PID1>  <DURATION>  <ROOT>/work\n",
        "stderr_lines": [],
        "log_events": []
      }
    },
    {
      "run": [
        "run",
        "claude",
        "--prompt-stdin"
      ],
      "stdin": "second",
      "env": {
        "RIVAL_QUEUE_TIMEOUT": "1s"
      },
      "timeout": 30,
      "expect": {
        "exit_code": 1,
        "stdout": "",
        "stderr_lines": [
          "rival queue: position 1/1 (1 running), waiting <DURATION>",
          "rival queue: queue timeout after 1s — queue may be wedged; inspect with 'rival queue', purge with 'rival queue clear'"
        ],
        "log_events": [
          {
            "level": "info",
            "message": "starting claude",
            "fields": {
              "session": "<UUID1>",
              "mode": "raw"
            }
          }
        ]
      }
    },
    {
      "run": [
        "queue",
        "clear",
        "--force"
      ],
      "expect": {
        "exit_code": 0,
        "stdout": "Removed 1 ticket.\n",
        "stderr_lines": [],
        "log_events": []
      }
    },
    {
      "run": [
        "queue"
      ],
      "expect": {
        "exit_code": 0,
        "stdout": "Queue is empty.\n",
        "stderr_lines": [],
        "log_events": []
      }
    },
    {
      "touch": "sync/go"
    },
    {
      "wait": "a",
      "expect": {
        "exit_code": 0,
        "stdout": "A done\n",
        "stderr_lines": [],
        "log_events": [
          {
            "level": "info",
            "message": "starting claude",
            "fields": {
              "session": "<UUID2>",
              "mode": "raw"
            }
          },
          {
            "level": "info",
            "message": "model native auth mode",
            "fields": {
              "session": "<UUID2>",
              "auth": "subscription"
            }
          }
        ]
      }
    }
  ],
  "expect": {
    "home_files": [
      ".rival/queue/.lock",
      ".rival/sessions/<UUID1>.json",
      ".rival/sessions/<UUID2>.json",
      ".rival/sessions/<UUID2>.log"
    ],
    "files": [
      {
        "path": "<HOME>/.rival/sessions/<UUID1>.json",
        "json": {
          "status": "failed",
          "exit_code": 1,
          "mode": "raw",
          "queue_position": 1,
          "error": "queue timeout after 1s — queue may be wedged; inspect with 'rival queue', purge with 'rival queue clear'"
        }
      },
      {
        "path": "<HOME>/.rival/sessions/<UUID2>.json",
        "json": {
          "status": "completed",
          "exit_code": 0,
          "mode": "native",
          "account": "subscription",
          "output_bytes": 7,
          "output_lines": 1,
          "owner_pid": "<PID1>"
        }
      },
      {
        "path": "<HOME>/.rival/sessions/<UUID2>.log",
        "text": "A done\n"
      }
    ],
    "calls": {
      "claude": 1
    }
  }
}
