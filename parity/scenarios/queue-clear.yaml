{
  "name": "queue-clear",
  "description": "internal/queue/queue.go. cmd/root.go reap() runs queue ReapDead before every non-TUI command, so the planted ticket of a dead PID (1<<24, the Go tests' deadPID) is reaped by the prerun scan (log 'reaping dead queue ticket' with ticket/pid/state) before Clear(false) runs; Clear then finds nothing dead ('Removed 0 dead tickets.', cmd/queue.go plural branch). A fresh unparseable .json and a fresh .tmp are younger than staleFileAge (60s), so readTicket and removeIfStale keep them; Clear(true) skips unparseable files ('Removed 0 tickets.'), and List shows nothing ('Queue is empty.').",
  "fixtures": [
    {
      "write": "home/.rival/queue/0000000000000000001-16777216-dead-1.json",
      "json": {
        "id": "dead-1",
        "mode": "review",
        "pid": 16777216,
        "state": "running",
        "created_at": "2026-01-02T03:04:05Z"
      },
      "mode": "0600"
    },
    {
      "write": "home/.rival/queue/0000000000000000002-1-garbage.json",
      "text": "{not json",
      "mode": "0600"
    },
    {
      "write": "home/.rival/queue/0000000000000000003-1-inflight.json.tmp",
      "text": "{",
      "mode": "0600"
    }
  ],
  "steps": [
    {
      "run": [
        "queue",
        "clear"
      ],
      "expect": {
        "exit_code": 0,
        "stdout": "Removed 0 dead tickets.\n",
        "stderr_lines": [],
        "log_events": [
          {
            "level": "info",
            "message": "reaping dead queue ticket",
            "fields": {
              "ticket": "dead-1",
              "pid": "<PID1>",
              "state": "running"
            }
          }
        ]
      }
    },
    {
      "run": [
        "queue",
        "clear",
        "--force"
      ],
      "expect": {
        "exit_code": 0,
        "stdout": "Removed 0 tickets.\n",
        "stderr_lines": [],
        "log_events": []
      }
    },
    {
      "run": [
        "queue"
      ],
      "expect": {
        "exit_code": 0,
        "stdout": "Queue is empty.\n",
        "stderr_lines": [],
        "log_events": []
      }
    }
  ],
  "expect": {
    "home_files": [
      ".rival/queue/.lock",
      ".rival/queue/0000000000000000002-1-garbage.json",
      ".rival/queue/0000000000000000003-1-inflight.json.tmp"
    ]
  }
}
