{
  "name": "plan-missing-file",
  "description": "`rival command plan` with `-re ultra docs/missing plan.md` on stdin. cmd/command_plan.go parsePlanInput keeps the spaces in the path, mergePlanEffort takes the stdin effort (flag not Changed), and resolvePlanPath joins the path under the absolute workdir and fails os.Stat with IsNotExist. The action prints 'plan file not found: <abs>' on stdout and returns ExitCodeError{1}; Execute prints it again on stderr. No session, no reviewer.",
  "steps": [
    {
      "run": [
        "command",
        "plan"
      ],
      "stdin": "-re ultra docs/missing plan.md\n",
      "expect": {
        "exit_code": 1,
        "stdout": "plan file not found: <ROOT>/work/docs/missing plan.md\n",
        "stderr_lines": [
          "plan file not found: <ROOT>/work/docs/missing plan.md"
        ],
        "log_events": []
      }
    }
  ],
  "expect": {
    "home_files": []
  }
}
