{
  "name": "antislop-default-dual",
  "description": "`rival command antislop` with `src/` on stdin and no -m: defaultAntislopModels = codex, claude (cmd/command_antislop.go). internal/review/planrun.go runDocReview preflights both, resolves ResolveAntislopEffort (codex is not pinned for antislop -> DefaultAntislopEffort high; claude pinned medium), creates two queued antislop sessions sharing one group id, takes ONE queue ticket (WaitForGroupSlot) and runs both reviewers concurrently. The start events race, so the sessions bind by cli (runner glob/where/bind). Output order follows the request (batch[r.index]), not completion: formatDocMultiConsole prints the codex block, a blank line, then the claude block. Each session completes with Complete(0, len(raw), 0). Release removes the ticket, leaving only the queue lock.",
  "fakes": {
    "scripts": {
      "codex": {
        "responses": [
          {
            "argv": [
              "login",
              "status"
            ],
            "times": 1,
            "stdout": "Logged in using ChatGPT\n",
            "exit": 0
          },
          {
            "argv": [
              "exec",
              "-C",
              "<ROOT>/work",
              "-m",
              "gpt-6-astra",
              "-c",
              "model_reasoning_effort=high",
              "--sandbox",
              "read-only",
              "--ephemeral",
              "--skip-git-repo-check",
              "--color",
              "never",
              "-"
            ],
            "times": 1,
            "expect": {
              "stdin": {
                "$regex": "Answer\\ the\\ user's\\ question\\ directly\\.\\ Do\\ not\\ offer\\ follow\\-up\\ options,\\ menus,\\ walkthroughs,\\ or\\ ask\\ if\\ they\\ want\\ more\\.\\ No\\ filler,\\ no\\ sign\\-offs\\.\\ Just\\ deliver\\ the\\ answer\\ and\\ stop\\.\n\nYou are working in project directory: <ROOT>/work\nUse your tools to read files, run git commands, and explore the codebase as needed\\.\n\nYou do a QUALITY-ONLY code review: hunt slop and over-engineering, not bugs\\.[^\n]*\n\nReview scope: src/\n(?s:.*)"
              },
              "cwd": "<ROOT>/work"
            },
            "stdout": "{\"summary\":\"Lean already.\",\"rating\":8,\"findings\":[]}\n",
            "exit": 0
          }
        ]
      },
      "claude": {
        "responses": [
          {
            "argv": [
              "-p",
              "--model",
              "claude-opus-5-5",
              "--effort",
              "medium",
              "--output-format",
              "text",
              "--no-session-persistence",
              "--system-prompt",
              "Answer the user's question directly. Do not offer follow-up options, menus, walkthroughs, or ask if they want more. No filler, no sign-offs. Just deliver the answer and stop.",
              "--safe-mode",
              "--setting-sources",
              "",
              "--settings",
              "{\"disableAllHooks\":true}",
              "--strict-mcp-config",
              "--mcp-config",
              "{\"mcpServers\":{}}",
              "--tools",
              "Read,Glob,Grep",
              "--allowedTools",
              "Read,Glob,Grep",
              "--disallowedTools",
              "mcp__*",
              "--permission-mode",
              "dontAsk"
            ],
            "times": 1,
            "expect": {
              "stdin": {
                "$regex": "You are working in project directory: <ROOT>/work\nUse your tools to read files, run git commands, and explore the codebase as needed\\.\n\nYou do a QUALITY-ONLY code review: hunt slop and over-engineering, not bugs\\.[^\n]*\n\nReview scope: src/\n(?s:.*)"
              },
              "cwd": "<ROOT>/work",
              "env": {
                "CLAUDECODE": null,
                "ANTHROPIC_API_KEY": null
              }
            },
            "stdout": "{\"summary\":\"One cut.\",\"rating\":6,\"findings\":[{\"file\":\"src/api/handler.go\",\"line\":30,\"severity\":\"medium\",\"category\":\"simplification\",\"title\":\"wrapper adds nothing\",\"body\":\"callOnce only forwards to call\",\"suggestion\":\"inline it\",\"confidence\":8}]}\n",
            "exit": 0
          }
        ]
      }
    }
  },
  "env": {
    "CLAUDECODE": "1",
    "ANTHROPIC_API_KEY": "sk-parity-must-not-leak"
  },
  "steps": [
    {
      "run": [
        "command",
        "antislop"
      ],
      "stdin": "src/",
      "expect": {
        "exit_code": 0,
        "stdout": "\n═══ RIVAL ANTISLOP REVIEW (codex + claude) ═══\n\nScope: src/\n\n── codex ──\n\nLeanness: 8/10\n\nSummary: Lean already.\n\nNo slop found.\n\n\n── claude ──\n\nLeanness: 6/10\n\nSummary: One cut.\n\n1. [med] wrapper adds nothing — src/api/handler.go:30\n   callOnce only forwards to call\n   Fix: inline it\n   (simplification, confidence 8)\n\nFindings: 1 total — 0 crit, 0 high, 1 med, 0 low\n",
        "stderr_lines": [],
        "log_events": [
          {
            "level": "info",
            "message": "starting plan reviewer",
            "fields": {
              "session": "<ID:CODEX>",
              "reviewer": "codex"
            }
          },
          {
            "level": "info",
            "message": "starting plan reviewer",
            "fields": {
              "session": "<ID:CLAUDE>",
              "reviewer": "claude"
            }
          },
          {
            "level": "info",
            "message": "model native auth mode",
            "fields": {
              "session": "<ID:CLAUDE>",
              "auth": "subscription",
              "model": "claude"
            }
          }
        ]
      }
    }
  ],
  "expect": {
    "home_files": [
      ".rival/queue/.lock",
      ".rival/sessions/<ID:CODEX>.json",
      ".rival/sessions/<ID:CODEX>.log",
      ".rival/sessions/<ID:CLAUDE>.json",
      ".rival/sessions/<ID:CLAUDE>.log"
    ],
    "files": [
      {
        "glob": "<HOME>/.rival/sessions/*.json",
        "where": {
          "cli": "codex"
        },
        "bind": {
          "CODEX": "id",
          "GROUP": "group_id"
        },
        "json": {
          "status": "completed",
          "exit_code": 0,
          "mode": "antislop",
          "review_scope": "src/",
          "work_dir": "<ROOT>/work",
          "group_id": "<ID:GROUP>",
          "output_lines": 0,
          "id": "<ID:CODEX>",
          "cli": "codex",
          "model": "gpt-6-astra",
          "effort": "high",
          "output_bytes": 53
        }
      },
      {
        "glob": "<HOME>/.rival/sessions/*.json",
        "where": {
          "cli": "claude"
        },
        "bind": {
          "CLAUDE": "id",
          "GROUP": "group_id"
        },
        "json": {
          "status": "completed",
          "exit_code": 0,
          "mode": "antislop",
          "review_scope": "src/",
          "work_dir": "<ROOT>/work",
          "group_id": "<ID:GROUP>",
          "output_lines": 0,
          "id": "<ID:CLAUDE>",
          "cli": "claude",
          "model": "claude-opus-5-5",
          "effort": "medium",
          "account": "subscription",
          "output_bytes": 246
        }
      },
      {
        "path": "<HOME>/.rival/sessions/<ID:CODEX>.log",
        "text": "{\"summary\":\"Lean already.\",\"rating\":8,\"findings\":[]}\n"
      },
      {
        "path": "<HOME>/.rival/sessions/<ID:CLAUDE>.log",
        "text": "{\"summary\":\"One cut.\",\"rating\":6,\"findings\":[{\"file\":\"src/api/handler.go\",\"line\":30,\"severity\":\"medium\",\"category\":\"simplification\",\"title\":\"wrapper adds nothing\",\"body\":\"callOnce only forwards to call\",\"suggestion\":\"inline it\",\"confidence\":8}]}\n"
      }
    ],
    "calls": {
      "codex": 2,
      "claude": 1
    }
  }
}
