{
  "name": "executor-grok-quota",
  "description": "`rival command grok` with 'review src/' (explicit scope: no git auto-detect). The fake exits 0 with only a quota signature (executor.IsQuotaExhausted 'insufficient_quota'); finishReview gets no parsed JSON, review.RunFailureReason returns the quota reason, the session fails with it, stdout keeps the public log, and Execute prints the reason. Review-mode argv/env from internal/executor/grok.go RunGrokModel/grokRunArgs/GrokEffort, GrokPreflight.",
  "fakes": {
    "scripts": {
      "grok": {
        "responses": [
          {
            "argv": [
              "--prompt-file",
              {
                "$regex": "<ROOT>/tmp/rival-grok-[0-9]+\\.md"
              },
              "-m",
              "grok-4.6",
              "--effort",
              "high",
              "--output-format",
              "plain",
              "--no-auto-update",
              "--yolo",
              "--cwd",
              "<ROOT>/work",
              "--sandbox",
              "read-only"
            ],
            "times": 1,
            "expect": {
              "stdin": "",
              "cwd": "<ROOT>/work"
            },
            "stdout": "ERROR: insufficient_quota\n",
            "exit": 0
          }
        ]
      }
    }
  },
  "fixtures": [
    {
      "write": "home/.grok/auth.json",
      "text": "{}\n",
      "mode": "0600"
    }
  ],
  "steps": [
    {
      "run": [
        "command",
        "grok"
      ],
      "stdin": "review src/",
      "expect": {
        "exit_code": 1,
        "stdout": "ERROR: insufficient_quota\n",
        "stderr_lines": [
          "grok hit provider quota/rate limit (429)"
        ],
        "log_events": [
          {
            "level": "info",
            "message": "starting grok (command mode)",
            "fields": {
              "session": "<UUID1>",
              "effort": "high",
              "mode": "review"
            }
          }
        ]
      }
    }
  ],
  "expect": {
    "home_files": [
      ".grok/auth.json",
      ".rival/queue/.lock",
      ".rival/sessions/<UUID1>.json",
      ".rival/sessions/<UUID1>.log"
    ],
    "files": [
      {
        "path": "<HOME>/.rival/sessions/<UUID1>.json",
        "json": {
          "status": "failed",
          "exit_code": 1,
          "cli": "grok",
          "model": "grok-4.6",
          "effort": "high",
          "mode": "review",
          "work_dir": "<ROOT>/work",
          "error": "grok hit provider quota/rate limit (429)",
          "review_scope": "src/"
        }
      },
      {
        "path": "<HOME>/.rival/sessions/<UUID1>.log",
        "text": "ERROR: insufficient_quota\n"
      }
    ],
    "calls": {
      "grok": 1
    }
  }
}
