{
  "name": "executor-grok-missing-auth",
  "description": "GrokPreflight: grok is on PATH (looked up only) but $HOME/.grok/auth.json does not exist. The path comes from os.UserHomeDir, never $GROK_HOME. No session is created.",
  "fakes": {
    "scripts": {
      "grok": {
        "responses": [
          {
            "argv_prefix": [],
            "stderr": "fake must not run\n",
            "exit": 97
          }
        ]
      }
    }
  },
  "steps": [
    {
      "run": [
        "command",
        "grok"
      ],
      "stdin": "explain the auth flow",
      "expect": {
        "exit_code": 1,
        "stdout": "",
        "stderr_lines": [
          "grok authentication is unavailable (<HOME>/.grok/auth.json not found); run `grok login`"
        ],
        "log_events": []
      }
    }
  ],
  "expect": {
    "home_files": [],
    "calls": {
      "grok": 0
    }
  }
}
