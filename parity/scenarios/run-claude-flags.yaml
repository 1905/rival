{
  "name": "run-claude-flags",
  "description": "`rival run claude` (cmd/run_claude.go, cmd/model_run.go runModelRun). Step 1: --effort nope fails first, before stdin (spec.resolveEffort -> config.ResolveEffort 'invalid effort \"nope\" for claude'). Step 2: neither --prompt-stdin nor --review -> 'provide --prompt-stdin or --review'. Step 3: --prompt-stdin with empty stdin -> 'empty prompt'. Step 4: --prompt-stdin --effort high --no-queue --workdir sub: raw mode; executor/claude.go runClaudeModel computes readOnly from the session mode (raw -> false), so claudeArgs gives --dangerously-skip-permissions, and config.ClaudeEffortLevel maps high to --effort max. The session records effort high and mode native, with no queue file; stdout is the live mirror. Step 5: --review src/ --no-queue: readOnly is computed from the original 'review' mode before setClaudeTransportMode replaces it with native, so claude gets the read-only safe argv at the default medium. Bug-hunter prompt (BuildReviewerPrompt), mirror then '\\n' + FormatReviewResult (cmd/model_run.go).",
  "env": {
    "CLAUDECODE": "1",
    "ANTHROPIC_API_KEY": "sk-parity-must-not-leak"
  },
  "fixtures": [
    {
      "mkdir": "work/sub"
    }
  ],
  "fakes": {
    "scripts": {
      "claude": {
        "responses": [
          {
            "argv": [
              "-p",
              "--model",
              "claude-opus-5-5",
              "--effort",
              "max",
              "--output-format",
              "text",
              "--no-session-persistence",
              "--system-prompt",
              "Answer the user's question directly. Do not offer follow-up options, menus, walkthroughs, or ask if they want more. No filler, no sign-offs. Just deliver the answer and stop.",
              "--dangerously-skip-permissions"
            ],
            "times": 1,
            "expect": {
              "stdin": "You are working in project directory: <ROOT>/work/sub\nUse your tools to read files, run git commands, and explore the codebase as needed.\n\nexplain the auth flow",
              "cwd": "<ROOT>/work/sub",
              "env": {
                "CLAUDECODE": null,
                "ANTHROPIC_API_KEY": null
              }
            },
            "stdout": "A done\n",
            "exit": 0
          },
          {
            "argv": [
              "-p",
              "--model",
              "claude-opus-5-5",
              "--effort",
              "medium",
              "--output-format",
              "text",
              "--no-session-persistence",
              "--system-prompt",
              "Answer the user's question directly. Do not offer follow-up options, menus, walkthroughs, or ask if they want more. No filler, no sign-offs. Just deliver the answer and stop.",
              "--safe-mode",
              "--setting-sources",
              "",
              "--settings",
              "{\"disableAllHooks\":true}",
              "--strict-mcp-config",
              "--mcp-config",
              "{\"mcpServers\":{}}",
              "--tools",
              "Read,Glob,Grep",
              "--allowedTools",
              "Read,Glob,Grep",
              "--disallowedTools",
              "mcp__*",
              "--permission-mode",
              "dontAsk"
            ],
            "times": 1,
            "expect": {
              "stdin": {
                "$regex": "You are working in project directory: <ROOT>/work\nUse your tools to read files, run git commands, and explore the codebase as needed\\.\n\nReview scope: src/\n\n## Role: Implementation Bug Hunter\n(?s:.*)"
              },
              "cwd": "<ROOT>/work"
            },
            "stdout": "{\"summary\":\"Looks fine.\",\"findings\":[]}\n",
            "exit": 0
          }
        ]
      }
    }
  },
  "steps": [
    {
      "run": [
        "run",
        "claude",
        "--effort",
        "nope",
        "--prompt-stdin"
      ],
      "stdin": "hi",
      "expect": {
        "exit_code": 1,
        "stdout": "",
        "stderr_lines": [
          "invalid effort \"nope\" for claude"
        ],
        "log_events": []
      }
    },
    {
      "run": [
        "run",
        "claude"
      ],
      "expect": {
        "exit_code": 1,
        "stdout": "",
        "stderr_lines": [
          "provide --prompt-stdin or --review"
        ],
        "log_events": []
      }
    },
    {
      "run": [
        "run",
        "claude",
        "--prompt-stdin"
      ],
      "stdin": "",
      "expect": {
        "exit_code": 1,
        "stdout": "",
        "stderr_lines": [
          "empty prompt"
        ],
        "log_events": []
      }
    },
    {
      "run": [
        "run",
        "claude",
        "--prompt-stdin",
        "--effort",
        "high",
        "--no-queue",
        "--workdir",
        "sub"
      ],
      "stdin": "explain the auth flow",
      "expect": {
        "exit_code": 0,
        "stdout": "A done\n",
        "stderr_lines": [],
        "log_events": [
          {
            "level": "info",
            "message": "starting claude",
            "fields": {
              "session": "<UUID1>",
              "effort": "high",
              "mode": "raw"
            }
          },
          {
            "level": "info",
            "message": "model native auth mode",
            "fields": {
              "session": "<UUID1>",
              "auth": "subscription",
              "model": "claude"
            }
          }
        ]
      }
    },
    {
      "run": [
        "run",
        "claude",
        "--review",
        "src/",
        "--no-queue"
      ],
      "expect": {
        "exit_code": 0,
        "stdout": "{\"summary\":\"Looks fine.\",\"findings\":[]}\n\n\n═══ RIVAL REVIEW ═══\n\nModel: claude (claude-opus-5-5)\nScope: src/\n\nSummary: Looks fine.\n\nNo issues found.\nLog: <HOME>/.rival/sessions/<UUID2>.log\n",
        "stderr_lines": [],
        "log_events": [
          {
            "level": "info",
            "message": "starting claude",
            "fields": {
              "session": "<UUID2>",
              "effort": "medium",
              "mode": "review"
            }
          },
          {
            "level": "info",
            "message": "model native auth mode",
            "fields": {
              "session": "<UUID2>",
              "auth": "subscription",
              "model": "claude"
            }
          }
        ]
      }
    }
  ],
  "expect": {
    "home_files": [
      ".rival/sessions/<UUID1>.json",
      ".rival/sessions/<UUID1>.log",
      ".rival/sessions/<UUID2>.json",
      ".rival/sessions/<UUID2>.log"
    ],
    "files": [
      {
        "path": "<HOME>/.rival/sessions/<UUID1>.json",
        "json": {
          "status": "completed",
          "exit_code": 0,
          "cli": "claude",
          "model": "claude-opus-5-5",
          "effort": "high",
          "mode": "native",
          "work_dir": "<ROOT>/work/sub",
          "account": "subscription",
          "output_bytes": 7,
          "output_lines": 1
        }
      },
      {
        "path": "<HOME>/.rival/sessions/<UUID2>.json",
        "json": {
          "status": "completed",
          "exit_code": 0,
          "cli": "claude",
          "effort": "medium",
          "mode": "native",
          "review_scope": "src/",
          "work_dir": "<ROOT>/work",
          "output_bytes": 40,
          "output_lines": 1
        }
      }
    ],
    "calls": {
      "claude": 2
    }
  }
}
