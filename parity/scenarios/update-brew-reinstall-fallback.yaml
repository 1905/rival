{
  "name": "update-brew-reinstall-fallback",
  "description": "cmd/update.go: `brew upgrade` exits 1 (its stderr passes through) -> 'brew upgrade failed, trying reinstall...' and `brew reinstall 1905/tap/rival`, which succeeds; the rest is the normal upgrade path.",
  "normalise": [
    {
      "regex": "v(\\d+\\.\\d+\\.\\d+)",
      "kind": "replace",
      "replace": "<V>"
    }
  ],
  "fixtures": [
    {
      "copy_bin": "brew/opt/rival/bin/rival"
    }
  ],
  "fakes": {
    "scripts": {
      "brew": {
        "responses": [
          {
            "argv": [
              "upgrade",
              "1905/tap/rival"
            ],
            "times": 1,
            "stderr": "Error: rival is already installed\n",
            "exit": 1
          },
          {
            "argv": [
              "reinstall",
              "1905/tap/rival"
            ],
            "times": 1,
            "stdout": "==> Reinstalling 1905/tap/rival\n",
            "exit": 0
          },
          {
            "argv": [
              "--prefix",
              "rival"
            ],
            "times": 1,
            "stdout": "<ROOT>/brew/opt/rival\n",
            "exit": 0
          }
        ]
      }
    }
  },
  "steps": [
    {
      "run": [
        "update"
      ],
      "expect": {
        "exit_code": 0,
        "stdout": "Checking for updates... vdev → v<V>\n\nUpgrading via Homebrew...\nbrew upgrade failed, trying reinstall...\n==> Reinstalling 1905/tap/rival\n\nUpdating skills...\nInstalling claude skills to <HOME>/.claude/skills\n\n  ✓ rival-codex — installed (v<V>)\n  ✓ rival-plan — installed (v<V>)\n  ✓ rival-plan-codex — installed (v<V>)\n  ✓ rival-plan-claude — installed (v<V>)\n  ✓ rival-claude — installed (v<V>)\n  ✓ rival-k3 — installed (v<V>)\n  ✓ rival-grok — installed (v<V>)\n  ✓ rival-antislop — installed (v<V>)\n  ✓ rival-security — installed (v<V>)\n\nDone: 9 installed, 0 updated, 0 up to date, 0 removed\nInstalling codex skills to <HOME>/.agents/skills\n\n  ✓ rival-codex — installed (v<V>)\n  ✓ rival-plan — installed (v<V>)\n  ✓ rival-plan-codex — installed (v<V>)\n  ✓ rival-plan-claude — installed (v<V>)\n  ✓ rival-claude — installed (v<V>)\n  ✓ rival-k3 — installed (v<V>)\n  ✓ rival-grok — installed (v<V>)\n  ✓ rival-antislop — installed (v<V>)\n  ✓ rival-security — installed (v<V>)\n\nDone: 9 installed, 0 updated, 0 up to date, 0 removed\n\n✓ Updated to v<V>\n",
        "stderr_lines": [
          "Error: rival is already installed"
        ],
        "log_events": []
      }
    }
  ],
  "expect": {
    "home_files": [
      ".claude/skills/rival-codex/SKILL.md",
      ".claude/skills/rival-plan/SKILL.md",
      ".claude/skills/rival-plan-codex/SKILL.md",
      ".claude/skills/rival-plan-claude/SKILL.md",
      ".claude/skills/rival-claude/SKILL.md",
      ".claude/skills/rival-k3/SKILL.md",
      ".claude/skills/rival-grok/SKILL.md",
      ".claude/skills/rival-antislop/SKILL.md",
      ".claude/skills/rival-security/SKILL.md",
      ".agents/skills/rival-codex/SKILL.md",
      ".agents/skills/rival-plan/SKILL.md",
      ".agents/skills/rival-plan-codex/SKILL.md",
      ".agents/skills/rival-plan-claude/SKILL.md",
      ".agents/skills/rival-claude/SKILL.md",
      ".agents/skills/rival-k3/SKILL.md",
      ".agents/skills/rival-grok/SKILL.md",
      ".agents/skills/rival-antislop/SKILL.md",
      ".agents/skills/rival-security/SKILL.md"
    ],
    "calls": {
      "brew": 3
    },
    "http_requests": [
      {
        "method": "GET",
        "path": "/repos/1905/rival/releases/latest"
      }
    ]
  },
  "update_server": {
    "routes": {
      "/repos/1905/rival/releases/latest": {
        "status": 200,
        "json": {
          "tag_name": "v9.9.9"
        }
      }
    }
  }
}
