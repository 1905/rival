{
  "name": "executor-codex-failure",
  "description": "`rival command codex` raw prompt whose provider exits 1. runModelCommand prints the log on stdout, fails the session with 'codex exited with code 1' (review.RunTimeoutReason fallback, no deadline), and cmd/root.go Execute prints the ExitCodeError on stderr. Exact argv/env from internal/executor/codex.go RunCodexModel/codexRunArgs, CodexPreflightFor.",
  "fakes": {
    "scripts": {
      "codex": {
        "responses": [
          {
            "argv": [
              "login",
              "status"
            ],
            "times": 1,
            "stdout": "Logged in using ChatGPT\n",
            "exit": 0
          },
          {
            "argv": [
              "exec",
              "-C",
              "<ROOT>/work",
              "-m",
              "gpt-6-astra",
              "-c",
              "model_reasoning_effort=xhigh",
              "--sandbox",
              "read-only",
              "--ephemeral",
              "--skip-git-repo-check",
              "--color",
              "never",
              "-"
            ],
            "times": 1,
            "expect": {
              "stdin": "Answer the user's question directly. Do not offer follow-up options, menus, walkthroughs, or ask if they want more. No filler, no sign-offs. Just deliver the answer and stop.\n\nYou are working in project directory: <ROOT>/work\nUse your tools to read files, run git commands, and explore the codebase as needed.\n\nexplain the auth flow",
              "cwd": "<ROOT>/work"
            },
            "stdout": "boom\n",
            "exit": 1
          }
        ]
      }
    }
  },
  "steps": [
    {
      "run": [
        "command",
        "codex"
      ],
      "stdin": "explain the auth flow",
      "expect": {
        "exit_code": 1,
        "stdout": "boom\n",
        "stderr_lines": [
          "codex exited with code 1"
        ],
        "log_events": [
          {
            "level": "info",
            "message": "starting codex (command mode)",
            "fields": {
              "session": "<UUID1>",
              "effort": "xhigh",
              "mode": "raw"
            }
          }
        ]
      }
    }
  ],
  "expect": {
    "home_files": [
      ".rival/queue/.lock",
      ".rival/sessions/<UUID1>.json",
      ".rival/sessions/<UUID1>.log"
    ],
    "files": [
      {
        "path": "<HOME>/.rival/sessions/<UUID1>.json",
        "json": {
          "status": "failed",
          "exit_code": 1,
          "cli": "codex",
          "model": "gpt-6-astra",
          "effort": "xhigh",
          "mode": "raw",
          "work_dir": "<ROOT>/work",
          "error": "codex exited with code 1"
        }
      },
      {
        "path": "<HOME>/.rival/sessions/<UUID1>.log",
        "text": "boom\n"
      }
    ],
    "calls": {
      "codex": 2
    }
  }
}
