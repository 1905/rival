{
  "name": "update-check-notice-source-compat",
  "description": "SOURCE-COMPATIBILITY case for internal/update/check.go on the default dev build. Go compares normalizeVersion strings, not semver: 'dev' stays 'dev' (not three parts) and the canned tag vzzz -> 'zzz', which sorts after 'dev', so printIfNewer prints the notice with a blank line before and after on stderr. CI and RIVAL_NO_UPDATE_CHECK are unset, so skipCheck is false. Step 1: no cache -> FetchLatest (one GET), saveCache writes {latest, checked_at} under ~/.rival/.update-check. Step 2: the cache is younger than cacheTTL (24h), so the notice prints again with no request. cmd/root.go joins the check for up to 2s before exit.",
  "env": {
    "CI": null,
    "RIVAL_NO_UPDATE_CHECK": null
  },
  "steps": [
    {
      "run": [
        "version"
      ],
      "expect": {
        "exit_code": 0,
        "stdout": "\n         _             __\n   _____(_)   ______ _/ /\n  / ___/ / | / / __ `/ /\n / /  / /| |/ / /_/ / /\n/_/  /_/ |___/\\__,_/_/\n  dev\n",
        "stderr_lines": [
          "",
          "  Update available: vdev → vzzz — run 'rival update'",
          ""
        ],
        "log_events": []
      }
    },
    {
      "run": [
        "version"
      ],
      "expect": {
        "exit_code": 0,
        "stdout": "\n         _             __\n   _____(_)   ______ _/ /\n  / ___/ / | / / __ `/ /\n / /  / /| |/ / /_/ / /\n/_/  /_/ |___/\\__,_/_/\n  dev\n",
        "stderr_lines": [
          "",
          "  Update available: vdev → vzzz — run 'rival update'",
          ""
        ],
        "log_events": []
      }
    }
  ],
  "expect": {
    "home_files": [
      ".rival/.update-check"
    ],
    "files": [
      {
        "path": "<HOME>/.rival/.update-check",
        "json": {
          "latest": "zzz",
          "checked_at": "<TIME>"
        }
      }
    ],
    "http_requests": [
      {
        "method": "GET",
        "path": "/repos/1905/rival/releases/latest"
      }
    ]
  },
  "update_server": {
    "routes": {
      "/repos/1905/rival/releases/latest": {
        "status": 200,
        "json": {
          "tag_name": "vzzz"
        }
      }
    }
  }
}
