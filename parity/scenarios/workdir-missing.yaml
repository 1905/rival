{
  "name": "workdir-missing",
  "description": "Every --workdir flag with a missing directory. cmd/workdir.go resolveWorkdir: filepath.Abs, then os.Stat IsNotExist -> 'workdir not found: <abs>'. resolveWorkdirOrExit (command surface: model_command.go after the stdin parse, command_plan.go/command_security.go first) also prints it to stdout and returns ExitCodeError 1. cmd/model_run.go returns the plain error after reading --prompt-stdin. No provider, session or queue file is touched.",
  "steps": [
    {
      "run": [
        "command",
        "codex",
        "--workdir",
        "missing"
      ],
      "stdin": "explain the auth flow",
      "expect": {
        "exit_code": 1,
        "stdout": "workdir not found: <ROOT>/work/missing\n",
        "stderr_lines": [
          "workdir not found: <ROOT>/work/missing"
        ],
        "log_events": []
      }
    },
    {
      "run": [
        "command",
        "claude",
        "--workdir",
        "missing"
      ],
      "stdin": "explain the auth flow",
      "expect": {
        "exit_code": 1,
        "stdout": "workdir not found: <ROOT>/work/missing\n",
        "stderr_lines": [
          "workdir not found: <ROOT>/work/missing"
        ],
        "log_events": []
      }
    },
    {
      "run": [
        "command",
        "grok",
        "--workdir",
        "missing"
      ],
      "stdin": "explain the auth flow",
      "expect": {
        "exit_code": 1,
        "stdout": "workdir not found: <ROOT>/work/missing\n",
        "stderr_lines": [
          "workdir not found: <ROOT>/work/missing"
        ],
        "log_events": []
      }
    },
    {
      "run": [
        "command",
        "k3",
        "--workdir",
        "missing"
      ],
      "stdin": "explain the auth flow",
      "expect": {
        "exit_code": 1,
        "stdout": "workdir not found: <ROOT>/work/missing\n",
        "stderr_lines": [
          "workdir not found: <ROOT>/work/missing"
        ],
        "log_events": []
      }
    },
    {
      "run": [
        "command",
        "plan",
