        "missing"
      ],
      "stdin": "hi",
      "expect": {
        "exit_code": 1,
        "stdout": "",
        "stderr_lines": [
          "workdir not found: <ROOT>/work/missing"
        ],
        "log_events": []
      }
    },
    {
      "run": [
        "run",
        "grok",
        "--prompt-stdin",
        "--workdir",
        "missing"
      ],
      "stdin": "hi",
      "expect": {
