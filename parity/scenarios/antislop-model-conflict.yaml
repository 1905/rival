{
  "name": "antislop-model-conflict",
  "description": "`rival command antislop -m claude` with `-m codex src/` on stdin. cmd/command_antislop.go: parser.ParseReviewArgs returns Models [codex] and Flags().Changed(\"model\") is true, so the action prints 'model selection was provided both as --model command flags and in arguments; use one form' on stdout and returns ExitCodeError{1}; Execute prints it again on stderr. No session, no reviewer.",
  "steps": [
    {
      "run": [
        "command",
        "antislop",
        "-m",
        "claude"
      ],
      "stdin": "-m codex src/",
      "expect": {
        "exit_code": 1,
        "stdout": "model selection was provided both as --model command flags and in arguments; use one form\n",
        "stderr_lines": [
          "model selection was provided both as --model command flags and in arguments; use one form"
        ],
        "log_events": []
      }
    }
  ],
  "expect": {
    "home_files": []
  }
}
