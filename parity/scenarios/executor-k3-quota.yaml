{
  "name": "executor-k3-quota",
  "description": "`rival command k3` with 'review src/' (explicit scope: no git auto-detect). The fake exits 0 with only a quota signature (executor.IsQuotaExhausted 'insufficient_quota'); finishReview gets no parsed JSON, review.RunFailureReason returns the quota reason, the session fails with it, stdout keeps the public log, and Execute prints the reason. Review-mode argv/env from internal/executor/kimi.go RunKimi/kimiRunOpts/KimiPreflight, opencode.go RunOpencodeEntry/opencodeRunArgs/opencodeRunEnvWith/opencodeProviderConfig.",
  "fakes": {
    "scripts": {
      "opencode": {
        "responses": [
          {
            "argv": [
              "run",
              "--pure",
              "-m",
              "moonshotai/kimi-k3",
              "--variant",
              "max",
              "--dir",
              "<ROOT>/work"
            ],
            "times": 1,
            "expect": {
              "stdin": {
                "$regex": "(?s).*src/.*"
              },
              "cwd": "<ROOT>/work",
              "env": {
                "OPENCODE_PERMISSION": "{\"read\":\"allow\",\"grep\":\"allow\",\"glob\":\"allow\",\"list\":\"allow\",\"external_directory\":\"deny\",\"edit\":\"deny\",\"bash\":\"deny\",\"task\":\"deny\",\"webfetch\":\"deny\",\"websearch\":\"deny\"}",
                "OPENCODE_CONFIG_CONTENT": "{\"$schema\":\"https://opencode.ai/config.json\",\"provider\":{\"moonshotai\":{\"options\":{\"apiKey\":\"sk-parity\"}}}}",
                "OPENCODE_DB": {
                  "$regex": "rival-[0-9a-f-]{36}\\.db"
                },
                "MOONSHOT_API_KEY": null,
                "AWS_PROFILE": "parity"
              }
            },
            "stdout": "ERROR: insufficient_quota\n",
            "exit": 0
          }
        ]
      }
    }
  },
  "env": {
    "MOONSHOT_API_KEY": "sk-parity",
    "AWS_PROFILE": "parity"
  },
  "steps": [
    {
      "run": [
        "command",
        "k3"
      ],
      "stdin": "review src/",
      "expect": {
        "exit_code": 1,
        "stdout": "ERROR: insufficient_quota\n",
        "stderr_lines": [
          "kimi-k3 hit provider quota/rate limit (429)"
        ],
        "log_events": [
          {
            "level": "info",
            "message": "starting k3 (command mode)",
            "fields": {
              "session": "<UUID1>",
              "effort": "max",
              "mode": "review"
            }
          }
        ]
      }
    }
  ],
  "expect": {
    "home_files": [
      ".rival/queue/.lock",
      ".rival/sessions/<UUID1>.json",
      ".rival/sessions/<UUID1>.log"
    ],
    "files": [
      {
        "path": "<HOME>/.rival/sessions/<UUID1>.json",
        "json": {
          "status": "failed",
          "exit_code": 1,
          "cli": "opencode",
          "model": "moonshotai/kimi-k3",
          "effort": "max",
          "mode": "review",
          "work_dir": "<ROOT>/work",
          "error": "kimi-k3 hit provider quota/rate limit (429)",
          "review_scope": "src/"
        }
      },
      {
        "path": "<HOME>/.rival/sessions/<UUID1>.log",
        "text": "ERROR: insufficient_quota\n"
      }
    ],
    "calls": {
      "opencode": 1
    }
  }
}
