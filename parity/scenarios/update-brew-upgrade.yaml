{
  "name": "update-brew-upgrade",
  "description": "cmd/update.go updateToVersion with tag v9.9.9 != dev: 'vdev → v9.9.9' and a blank line, 'Upgrading via Homebrew...', `brew upgrade 1905/tap/rival` with brew's stdout/stderr on the terminal, '\\nUpdating skills...', `brew --prefix rival` via Output() (its stderr is not shown), then installUpdatedSkills re-execs <prefix>/bin/rival install --force --target auto (a copy of the binary under test in a safe temp prefix) with the same stdio, then '\\n✓ Updated to v9.9.9'. The child's own update check is skipped by CI=1.",
  "normalise": [
    {
      "regex": "v(\\d+\\.\\d+\\.\\d+)",
      "kind": "replace",
      "replace": "<V>"
    }
  ],
  "fixtures": [
    {
      "copy_bin": "brew/opt/rival/bin/rival"
    }
  ],
  "fakes": {
    "scripts": {
      "brew": {
        "responses": [
          {
            "argv": [
              "upgrade",
              "1905/tap/rival"
            ],
            "times": 1,
            "stdout": "==> Upgrading 1905/tap/rival\n",
            "exit": 0
          },
          {
            "argv": [
              "--prefix",
              "rival"
            ],
            "times": 1,
            "stdout": "<ROOT>/brew/opt/rival\n",
            "stderr": "prefix noise\n",
            "exit": 0
          }
        ]
      }
    }
  },
  "steps": [
    {
      "run": [
        "update"
      ],
      "expect": {
        "exit_code": 0,
        "stdout": "Checking for updates... vdev → v<V>\n\nUpgrading via Homebrew...\n==> Upgrading 1905/tap/rival\n\nUpdating skills...\nInstalling claude skills to <HOME>/.claude/skills\n\n  ✓ rival-codex — installed (v<V>)\n  ✓ rival-plan — installed (v<V>)\n  ✓ rival-plan-codex — installed (v<V>)\n  ✓ rival-plan-claude — installed (v<V>)\n  ✓ rival-claude — installed (v<V>)\n  ✓ rival-k3 — installed (v<V>)\n  ✓ rival-grok — installed (v<V>)\n  ✓ rival-security — installed (v<V>)\n\nDone: 8 installed, 0 updated, 0 up to date, 0 removed\nInstalling codex skills to <HOME>/.agents/skills\n\n  ✓ rival-codex — installed (v<V>)\n  ✓ rival-plan — installed (v<V>)\n  ✓ rival-plan-codex — installed (v<V>)\n  ✓ rival-plan-claude — installed (v<V>)\n  ✓ rival-claude — installed (v<V>)\n  ✓ rival-k3 — installed (v<V>)\n  ✓ rival-grok — installed (v<V>)\n  ✓ rival-security — installed (v<V>)\n\nDone: 8 installed, 0 updated, 0 up to date, 0 removed\n\n✓ Updated to v<V>\n",
        "stderr_lines": [],
        "log_events": []
      }
    }
  ],
  "expect": {
    "home_files": [
      ".claude/skills/rival-codex/SKILL.md",
      ".claude/skills/rival-plan/SKILL.md",
      ".claude/skills/rival-plan-codex/SKILL.md",
      ".claude/skills/rival-plan-claude/SKILL.md",
      ".claude/skills/rival-claude/SKILL.md",
      ".claude/skills/rival-k3/SKILL.md",
      ".claude/skills/rival-grok/SKILL.md",
      ".claude/skills/rival-security/SKILL.md",
      ".agents/skills/rival-codex/SKILL.md",
      ".agents/skills/rival-plan/SKILL.md",
      ".agents/skills/rival-plan-codex/SKILL.md",
      ".agents/skills/rival-plan-claude/SKILL.md",
      ".agents/skills/rival-claude/SKILL.md",
      ".agents/skills/rival-k3/SKILL.md",
      ".agents/skills/rival-grok/SKILL.md",
      ".agents/skills/rival-security/SKILL.md"
    ],
    "calls": {
      "brew": 2
    },
    "http_requests": [
      {
        "method": "GET",
        "path": "/repos/1905/rival/releases/latest"
      }
    ]
  },
  "update_server": {
    "routes": {
      "/repos/1905/rival/releases/latest": {
        "status": 200,
        "json": {
          "tag_name": "v9.9.9"
        }
      }
    }
  }
}
