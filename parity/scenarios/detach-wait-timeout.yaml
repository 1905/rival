{
  "name": "detach-wait-timeout",
  "description": "cmd/wait.go waiter.run timeout branch. A detached `rival command claude --detach` holds its slot inside the fake. Its 'starting' line is logged before WaitForGroupSlot, so the ID is in the log before the fake touches sync/started. `rival wait --log --timeout 1s --poll 100ms`: the session is running and the pid is alive (procinfo.Alive with the start time pinned by parseLogFile), so after the deadline it prints 'still running after %s (rival pid %d)%s' with Duration.String '1s' and no queue suffix (lastQueueLine finds no 'rival queue:' line: the run never waited). waitExitTimeout -> 'rival wait: exit 4'. Zero and negative timeouts reach the same branch only after the status and liveness checks of the first pass ('0s', '-1s'; `--timeout=-1s` so the value is not read as a flag). wait's own prerun reap keeps the live run (ReapOrphans: owner alive; queue ReapDead: pid alive). After sync/go the run completes and a plain `wait --log` summarizes it, exit 0.",
  "timeout": 120,
  "fixtures": [{"mkdir": "sync"}],
  "fakes": {
    "scripts": {
      "claude": {
        "responses": [
          {
            "argv_prefix": ["-p"],
            "times": 1,
            "expect": {"stdin": {"$regex": "(?s).*hold the slot.*"}, "env": {"RIVAL_DETACHED": "1"}},
            "touch": "<ROOT>/sync/started",
            "wait_for": "<ROOT>/sync/go",
            "wait_timeout": 60,
            "stdout": "held done\n",
            "exit": 0
          }
        ]
      }
    }
  },
  "normalise": [
    {"regex": "\\(rival pid (\\d+)\\)", "kind": "pid"},
    {"regex": "(?m)^([0-9a-f]{8}) (?:completed|failed) exit=", "kind": "uuid_prefix"},
    {"regex": "(?m)^<UUID\\d+:8> \\S+ exit=-?\\d+ (\\S+)", "kind": "duration"}
  ],
  "steps": [
    {
      "run": ["command", "claude", "--detach"],
      "stdin": "hold the slot",
      "stdout_file": "out/claude.out",
      "stderr_file": "out/claude.err",
      "expect": {
        "exit_code": 0,
        "stdout": "held done\n",
        "stderr_lines": ["rival: detached pid=<PID1>"],
        "log_events": [
          {"level": "info", "message": "starting claude (command mode)",
           "fields": {"session": "<UUID1>", "effort": "medium", "mode": "raw"}},
          {"level": "info", "message": "model native auth mode",
           "fields": {"session": "<UUID1>", "auth": "subscription"}}
        ]
      }
    },
    {"wait_file": "sync/started", "timeout": 30},
    {
      "run": ["wait", "--log", "<ROOT>/out/claude.err", "--timeout", "1s", "--poll", "100ms"],
      "expect": {
        "exit_code": 4,
        "stdout": "still running after 1s (rival pid <PID1>)\n",
        "stderr_lines": ["rival wait: exit 4"],
        "log_events": []
      }
    },
    {
      "run": ["wait", "--log", "<ROOT>/out/claude.err", "--timeout", "0s"],
      "expect": {
        "exit_code": 4,
        "stdout": "still running after 0s (rival pid <PID1>)\n",
        "stderr_lines": ["rival wait: exit 4"],
        "log_events": []
      }
    },
    {
      "run": ["wait", "--log", "<ROOT>/out/claude.err", "--timeout=-1s"],
      "expect": {
        "exit_code": 4,
        "stdout": "still running after -1s (rival pid <PID1>)\n",
        "stderr_lines": ["rival wait: exit 4"],
        "log_events": []
      }
    },
    {"touch": "sync/go"},
    {"wait_idle": true, "timeout": 30},
    {
      "run": ["wait", "--log", "<ROOT>/out/claude.err", "--poll", "100ms"],
      "expect": {
        "exit_code": 0,
        "stdout": "<UUID1:8> completed exit=0 <DURATION>\nauto-fix: off\n",
        "stderr_lines": [],
        "log_events": []
      }
    }
  ],
  "expect": {
    "home_files": [
      ".rival/queue/.lock",
      ".rival/sessions/<UUID1>.json",
      ".rival/sessions/<UUID1>.log"
    ],
    "files": [
      {
        "path": "<HOME>/.rival/sessions/<UUID1>.json",
        "json": {"status": "completed", "exit_code": 0, "owner_pid": "<PID1>"}
      },
      {"path": "<HOME>/.rival/sessions/<UUID1>.log", "text": "held done\n"}
    ],
    "calls": {"claude": 1}
  }
}
