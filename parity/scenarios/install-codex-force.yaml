{
  "name": "install-codex-force",
  "description": "cmd/install.go with --target codex --force: only <HOME>/.agents/skills. rival-codex exists with 'version: old'; force skips the prompt and rewrites it with skills.CodexSkill ('  ✓ rival-codex — updated (vold → v<version>)'). The other eight are installed. No prompt text, no stdin read, no .claude directory.",
  "fixtures": [
    {
      "write": "home/.agents/skills/rival-codex/SKILL.md",
      "text": "---\nversion: old\n---\ncustom"
    }
  ],
  "normalise": [
    {
      "regex": "v(\\d+\\.\\d+\\.\\d+)",
      "kind": "replace",
      "replace": "<V>"
    }
  ],
  "steps": [
    {
      "run": [
        "install",
        "--target",
        "codex",
        "--force"
      ],
      "stdin": "",
      "expect": {
        "exit_code": 0,
        "stdout": "Installing codex skills to <HOME>/.agents/skills\n\n  ✓ rival-codex — updated (vold → v<V>)\n  ✓ rival-plan — installed (v<V>)\n  ✓ rival-plan-codex — installed (v<V>)\n  ✓ rival-plan-claude — installed (v<V>)\n  ✓ rival-claude — installed (v<V>)\n  ✓ rival-k3 — installed (v<V>)\n  ✓ rival-grok — installed (v<V>)\n  ✓ rival-antislop — installed (v<V>)\n  ✓ rival-security — installed (v<V>)\n\nDone: 8 installed, 1 updated, 0 up to date, 0 removed\n",
        "stderr_lines": [],
        "log_events": []
      }
    }
  ],
  "expect": {
    "home_files": [
      ".agents/skills/rival-codex/SKILL.md",
      ".agents/skills/rival-plan/SKILL.md",
      ".agents/skills/rival-plan-codex/SKILL.md",
      ".agents/skills/rival-plan-claude/SKILL.md",
      ".agents/skills/rival-claude/SKILL.md",
      ".agents/skills/rival-k3/SKILL.md",
      ".agents/skills/rival-grok/SKILL.md",
      ".agents/skills/rival-antislop/SKILL.md",
      ".agents/skills/rival-security/SKILL.md"
    ]
  }
}
