{
  "name": "executor-claude-docker-failure",
  "description": "`rival command claude` raw prompt whose provider exits 1. runModelCommand prints the log on stdout, fails the session with 'claude exited with code 1' (review.RunTimeoutReason fallback, no deadline), and cmd/root.go Execute prints the ExitCodeError on stderr. Exact argv/env from internal/executor/claude.go runClaudeModel (no claude on PATH) -> claude_docker.go ClaudeDockerPreflight/runClaudeDocker + claudeArgs.",
  "fakes": {
    "scripts": {
      "docker": {
        "responses": [
          {
            "argv": [
              "info"
            ],
            "times": 1,
            "stdout": "Server Version: fake\n",
            "exit": 0
          },
          {
            "argv": [
              "image",
              "inspect",
              "rival-claude"
            ],
            "times": 1,
            "stdout": "[{}]\n",
            "exit": 0
          },
          {
            "argv": [
              "run",
              "--rm",
              "-i",
              "-v",
              "<ROOT>/work:/workspace",
              "-w",
              "/workspace",
              "-e",
              "ANTHROPIC_AUTH_TOKEN=fixture-token",
              "rival-claude",
              "-p",
              "--model",
              "claude-opus-5-5",
              "--effort",
              "medium",
              "--output-format",
              "text",
              "--no-session-persistence",
              "--system-prompt",
              "Answer the user's question directly. Do not offer follow-up options, menus, walkthroughs, or ask if they want more. No filler, no sign-offs. Just deliver the answer and stop.",
              "--dangerously-skip-permissions"
            ],
            "times": 1,
            "expect": {
              "stdin": "You are working in project directory: <ROOT>/work\nUse your tools to read files, run git commands, and explore the codebase as needed.\n\nexplain the auth flow",
              "cwd": "<ROOT>/work"
            },
            "stdout": "boom\n",
            "exit": 1
          }
        ]
      }
    },
    "absent": [
      "claude"
    ]
  },
  "env": {
    "RIVAL_CLAUDE_TOKEN": "fixture-token"
  },
  "steps": [
    {
      "run": [
        "command",
        "claude"
      ],
      "stdin": "explain the auth flow",
      "expect": {
        "exit_code": 1,
        "stdout": "boom\n",
        "stderr_lines": [
          "claude exited with code 1"
        ],
        "log_events": [
          {
            "level": "info",
            "message": "starting claude (command mode)",
            "fields": {
              "session": "<UUID1>",
              "effort": "medium",
              "mode": "raw"
            }
          }
        ]
      }
    }
  ],
  "expect": {
    "home_files": [
      ".rival/queue/.lock",
      ".rival/sessions/<UUID1>.json",
      ".rival/sessions/<UUID1>.log"
    ],
    "files": [
      {
        "path": "<HOME>/.rival/sessions/<UUID1>.json",
        "json": {
          "status": "failed",
          "exit_code": 1,
          "cli": "claude",
          "model": "claude-opus-5-5",
          "effort": "medium",
          "mode": "docker",
          "work_dir": "<ROOT>/work",
          "error": "claude exited with code 1"
        }
      },
      {
        "path": "<HOME>/.rival/sessions/<UUID1>.log",
        "text": "boom\n"
      }
    ],
    "calls": {
      "docker": 3
    }
  }
}
