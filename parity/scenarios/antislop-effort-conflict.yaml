{
  "name": "antislop-effort-conflict",
  "description": "`rival command antislop --effort low` with `-re high src/` on stdin. cmd/command_antislop.go validates the Changed flag (low is valid), parses the stdin effort high, then mergePlanEffort(\"low\", true, \"high\") returns the conflict error. The action prints it on stdout and returns ExitCodeError{1}; Execute prints it again on stderr. No session, no reviewer.",
  "steps": [
    {
      "run": [
        "command",
        "antislop",
        "--effort",
        "low"
      ],
      "stdin": "-re high src/",
      "expect": {
        "exit_code": 1,
        "stdout": "reasoning effort conflicts: command uses \"low\" but plan arguments request \"high\"\n",
        "stderr_lines": [
          "reasoning effort conflicts: command uses \"low\" but plan arguments request \"high\""
        ],
        "log_events": []
      }
    }
  ],
  "expect": {
    "home_files": []
  }
}
