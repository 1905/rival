{
  "name": "security-missing-key",
  "description": "`rival command security` with scope `src/` on stdin and no MOONSHOT_API_KEY or KIMI_API anywhere. cmd/command_security.go reads the scope, rejectUnresolvedMR passes, then executor.OpencodePreflightEntry fails on the key (opencode is on PATH, never run). The action prints the error plus the security.reviewer hint on stdout and returns ExitCodeError{1} with the bare error, which Execute prints on stderr. No session is created.",
  "fakes": {
    "scripts": {
      "opencode": {
        "responses": [
          {
            "argv_prefix": [],
            "stderr": "fake must not run\n",
            "exit": 97
          }
        ]
      }
    }
  },
  "env": {
    "MOONSHOT_API_KEY": null,
    "KIMI_API": null
  },
  "steps": [
    {
      "run": [
        "command",
        "security"
      ],
      "stdin": "src/",
      "expect": {
        "exit_code": 1,
        "stdout": "model kimi-k3 requires MOONSHOT_API_KEY — add it to the project .env or export it\n\nsecurity.reviewer selects the model; accepted values: k3, grok\n",
        "stderr_lines": [
          "model kimi-k3 requires MOONSHOT_API_KEY — add it to the project .env or export it"
        ],
        "log_events": []
      }
    }
  ],
  "expect": {
    "home_files": [],
    "calls": {
      "opencode": 0
    }
  }
}
