name: CI

# Light CI for the Rust port (plan task 1.8). Releases are release.yml.
# Nothing here calls a real reviewer CLI, Docker, a provider API or
# inference: every test isolates HOME / RIVAL_HOME itself.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # The full e2e scenario run is on from P3 (every non-TUI command ported).
  # Set it to "false" to skip; the skip is then reported as a warning.
  E2E_SCENARIOS: "true"

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # Windows runs the whole Rust workspace, including the native
        # process-tree and cross-process queue tests. The Unix fd check and
        # the e2e scenarios (fake CLIs are Python scripts with Unix
        # shebangs) stay macOS/Linux only.
        os: [macos-15, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # Final bound so a hung native process test cannot use the 6 h default.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98"
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: cargo fmt
        run: cargo fmt --all --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      # Includes crates/rival-core/tests/contract.rs, which compares fresh
      # writer bytes with the committed testdata/written golden files. The
      # golden generator is #[ignore]d and never runs here.
      - name: cargo test
        run: cargo test --workspace --locked --no-fail-fast

      # The fd-state loader constructor must survive the final link in both
      # the debug and the LTO release binary (Rust only promises object-file
      # retention for #[used]). Runs rival with fd 0 or 2 closed; both cases
      # stop before any provider, queue or network work.
      # Unix-only (preexec_fn); Windows handles are covered by the native
      # Rust tests above.
      - name: Startup fd constructor (debug + LTO release)
        if: runner.os != 'Windows'
        run: python3 scripts/check-startup-fds.py

      # Release-archive checker and release-config contracts. The config
      # tests import PyYAML, pinned in scripts/requirements-test.txt and
      # installed into a fresh setup-python interpreter.
      - uses: actions/setup-python@v5
        if: runner.os == 'Linux'
        id: scripts-python
        with:
          python-version: "3.12"

      - name: Release script tests
        if: runner.os == 'Linux'
        env:
          PY: ${{ steps.scripts-python.outputs.python-path }}
        run: |
          "$PY" -m pip install -r scripts/requirements-test.txt
          "$PY" -m unittest discover -s scripts -p 'test_*.py' -v

      # No step may rewrite or add golden files. Git Bash on Windows; a
      # CRLF checkout of a pinned-LF fixture also shows up here.
      - name: Fixtures unchanged
        shell: bash
        run: |
          git status --porcelain -- testdata/
          test -z "$(git status --porcelain -- testdata/)"

      - name: E2E runner self-tests
        if: runner.os != 'Windows'
        run: python3 -m unittest discover -s e2e -p 'test_*.py'

      - name: E2E scenarios
        if: runner.os != 'Windows'
        run: |
          if [ "$E2E_SCENARIOS" != "true" ]; then
            echo "::warning::E2E scenarios skipped: E2E_SCENARIOS=$E2E_SCENARIOS (enabled from P3)."
            exit 0
          fi
          cargo build -p rival --locked
          python3 e2e/run.py --bin target/debug/rival

      # The app decodes the Rust writer's golden files (testdata/written).
      - name: Swift session decoding
        if: runner.os == 'macOS'
        working-directory: app
        run: |
          swift --version
          swift test --filter SessionDecodingTests
