[package]
name = "rival"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "rival"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
chrono = "0.4.45"
clap = { version = "4.6.7", default-features = false, features = ["std", "help", "usage", "error-context", "string"] }
clap_complete = { version = "4.6.11", default-features = false }
# use-dev-tty: poll-based reader that falls back to /dev/tty when stdin is a
# pipe (mio cannot register that fd), like bubbletea's Program.Run.
crossterm = { version = "0.29.0", features = ["use-dev-tty"] }
libc = "0.2.189"
# CommonMark parser for the TUI result view. The default features add an HTML
# writer and a CLI; the TUI needs only the event stream.
pulldown-cmark = { version = "0.13.4", default-features = false }
ratatui = "0.30.2"
regex = "1.13.1"
rival-core = { path = "../rival-core" }
sha2 = "0.11.0"
unicode-segmentation = "1.13.3"
unicode-width = "0.2.2"
uuid = { version = "1.26.1", features = ["v4"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Console",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
tempfile = "3.27.0"
