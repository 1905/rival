[package]
name = "rival"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "rival"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", default-features = false, features = ["std", "help", "usage", "error-context", "string"] }
clap_complete = { version = "4.6.11", default-features = false }
libc = "0.2.189"
regex = "1.13.1"
rival-core = { path = "../rival-core" }
sha2 = "0.11.0"
uuid = { version = "1.26.1", features = ["v4"] }

[dev-dependencies]
tempfile = "3.27.0"
