{
  "name": "detach-wait-failure",
  "description": "A detached `rival command claude --detach` whose provider exits 1. The parent prints 'rival: detached pid=N' and exits 0. The child records a failed session ('claude exited with code 1'), prints the provider log ('B failed') to the inherited stdout, and prints the error to the inherited stderr. `rival wait --log` sees the dead child and a terminal failed session, prints '<id8> failed exit=1 <duration> — claude exited with code 1', and exits 2 with 'rival wait: exit 2' on stderr.",
  "fakes": {
    "scripts": {
      "claude": {
        "responses": [
          {
            "argv_prefix": ["-p"],
            "times": 1,
            "expect": {"stdin": {"$regex": "(?s).*find the bug.*"}, "env": {"RIVAL_DETACHED": "1"}},
            "stdout": "B failed\n",
            "exit": 1
          }
        ]
      }
    }
  },
  "normalise": [
    {"regex": "(?m)^([0-9a-f]{8}) (?:completed|failed) exit=", "kind": "uuid_prefix"},
    {"regex": "(?m)^<UUID\\d+:8> \\S+ exit=-?\\d+ (\\S+)", "kind": "duration"}
  ],
  "steps": [
    {
      "run": ["command", "claude", "--detach"],
      "stdin": "find the bug",
      "stdout_file": "out/claude.out",
      "stderr_file": "out/claude.err",
      "expect": {
        "exit_code": 0,
        "stdout": "B failed\n",
        "stderr_lines": ["rival: detached pid=<PID1>", "claude exited with code 1"],
        "log_events": [
          {"level": "info", "message": "starting claude (command mode)",
           "fields": {"session": "<UUID1>", "effort": "medium", "mode": "raw"}},
          {"level": "info", "message": "model native auth mode",
           "fields": {"session": "<UUID1>", "auth": "subscription"}}
        ]
      }
    },
    {"wait_idle": true, "timeout": 30},
    {
      "run": ["wait", "--log", "<ROOT>/out/claude.err"],
      "expect": {
        "exit_code": 2,
        "stdout": "<UUID1:8> failed exit=1 <DURATION> — claude exited with code 1\nauto-fix: off\n",
        "stderr_lines": ["rival wait: exit 2"],
        "log_events": []
      }
    }
  ],
  "expect": {
    "home_files": [
      ".rival/queue/.lock",
      ".rival/sessions/<UUID1>.json",
      ".rival/sessions/<UUID1>.log"
    ],
    "files": [
      {
        "path": "<HOME>/.rival/sessions/<UUID1>.json",
        "json": {
          "status": "failed",
          "exit_code": 1,
          "error": "claude exited with code 1",
          "owner_pid": "<PID1>"
        }
      },
      {"path": "<HOME>/.rival/sessions/<UUID1>.log", "text": "B failed\n"}
    ],
    "calls": {"claude": 1}
  }
}
