{
  "name": "detach-redirect-unlink",
  "description": "`rival command claude --detach` passes its own stdin, stdout and stderr to the child unchanged, so shell redirects like `< prompt > out 2> err` keep working. The caller redirects stdin from a file with spaces and parentheses in its name, and stdout/stderr to new files with spaces and non-ASCII names. The runner unlinks the stdin file right after the parent exits, so the child reads the prompt through its inherited descriptor. The fake checks the prompt and RIVAL_DETACHED=1. The child writes 'A done' to the stdout file and its log lines to the stderr file after the 'rival: detached pid=N' line, in the caller's working directory. `rival wait --log` on the named stderr file reports the session completed, exit 0. The runner cannot hold the child's stdin read until after the unlink, so the read may come first; the inherited-descriptor path is the same either way.",
  "fixtures": [
    {"write": "in/prompt (1).txt", "text": "explain the auth flow\n", "mode": "0600"}
  ],
  "fakes": {
    "scripts": {
      "claude": {
        "responses": [
          {
            "argv_prefix": ["-p"],
            "times": 1,
            "expect": {"stdin": {"$regex": "(?s).*explain the auth flow.*"}, "env": {"RIVAL_DETACHED": "1"}},
            "stdout": "A done\n",
            "exit": 0
          }
        ]
      }
    }
  },
  "normalise": [
    {"regex": "(?m)^([0-9a-f]{8}) (?:completed|failed) exit=", "kind": "uuid_prefix"},
    {"regex": "(?m)^<UUID\\d+:8> \\S+ exit=-?\\d+ (\\S+)", "kind": "duration"}
  ],
  "steps": [
    {
      "run": ["command", "claude", "--detach"],
      "stdin_file": "in/prompt (1).txt",
      "unlink_stdin": true,
      "stdout_file": "out/my review — résumé.out",
      "stderr_file": "elsewhere/err log (detached).txt",
      "expect": {
        "exit_code": 0,
        "stdout": "A done\n",
        "stderr_lines": ["rival: detached pid=<PID1>"],
        "log_events": [
          {"level": "info", "message": "starting claude (command mode)",
           "fields": {"session": "<UUID1>", "effort": "medium", "mode": "raw"}},
          {"level": "info", "message": "model native auth mode",
           "fields": {"session": "<UUID1>", "auth": "subscription"}}
        ]
      }
    },
    {"wait_idle": true, "timeout": 30},
    {
      "run": ["wait", "--log", "<ROOT>/elsewhere/err log (detached).txt"],
      "expect": {
        "exit_code": 0,
        "stdout": "<UUID1:8> completed exit=0 <DURATION>\nauto-fix: off\n",
        "stderr_lines": [],
        "log_events": []
      }
    }
  ],
  "expect": {
    "home_files": [
      ".rival/queue/.lock",
      ".rival/sessions/<UUID1>.json",
      ".rival/sessions/<UUID1>.log"
    ],
    "files": [
      {"path": "<ROOT>/in/prompt (1).txt", "absent": true},
      {
        "path": "<HOME>/.rival/sessions/<UUID1>.json",
        "json": {"status": "completed", "exit_code": 0, "work_dir": "<ROOT>/work", "owner_pid": "<PID1>"}
      },
      {"path": "<HOME>/.rival/sessions/<UUID1>.log", "text": "A done\n"}
    ],
    "calls": {"claude": 1}
  }
}
