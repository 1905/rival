{
  "name": "security-china-structured",
  "description": "`rival command security` with scope `src/api/` on stdin and the default china.model (moonshot/kimi-k3.1-pro). The preflight runs `opencode --version` once. One queued security session runs `opencode run --standalone --agent rival-china` at effort max with no group, logs 'starting security reviewer' and takes a queue slot. The run is read-only: OPENCODE_CONFIG_CONTENT carries the deny-all profile, OPENCODE_DISABLE_PROJECT_CONFIG=1, and no OPENCODE_DB or OPENCODE_PERMISSION. The language pass runs at low. The final answer is parsed and validated; stdout is the security review console format with the Scenario line kept. The session completes with the subprocess byte and line counts, exit code 0.",
  "fakes": {
    "scripts": {
      "opencode": {
        "responses": [
          {
            "argv": [
              "--version"
            ],
            "times": 1,
            "stdout": "opencode v2.1.4\n",
            "exit": 0
          },
          {
            "argv": [
              "run",
              "--standalone",
              "--agent",
              "rival-china",
              "-m",
              "moonshot/kimi-k3.1-pro"
            ],
            "times": 1,
            "expect": {
              "stdin": {
                "$regex": "Answer the user's question directly\\. Do not offer follow-up options, menus, walkthroughs, or ask if they want more\\. No filler, no sign-offs\\. Just deliver the answer and stop\\.\n\nYou are working in project directory: <ROOT>/work\nUse your tools to read files, run git commands, and explore the codebase as needed\\.\n\nReview scope: src/api/\n\n## Role: Security Reviewer\n(?s:.*)"
              },
              "cwd": "<ROOT>/work",
              "env": {
                "OPENCODE_CONFIG_CONTENT": "{\"$schema\":\"https://opencode.ai/config.json\",\"agent\":{\"rival-china\":{\"mode\":\"primary\",\"permission\":{\"*\":\"deny\",\"external_directory\":\"deny\",\"glob\":\"allow\",\"grep\":\"allow\",\"list\":\"allow\",\"read\":\"allow\"}}},\"permission\":{\"*\":\"deny\",\"external_directory\":\"deny\",\"glob\":\"allow\",\"grep\":\"allow\",\"list\":\"allow\",\"read\":\"allow\"},\"provider\":{\"moonshot\":{\"models\":{\"kimi-k3.1-pro\":{\"options\":{\"reasoningEffort\":\"max\"}}}}}}",
                "OPENCODE_DISABLE_PROJECT_CONFIG": "1",
                "OPENCODE_DB": null,
                "OPENCODE_PERMISSION": null
              }
            },
            "stdout": "{\"summary\":\"One injectable query.\",\"findings\":[{\"file\":\"src/api/users.go\",\"line\":42,\"severity\":\"high\",\"category\":\"injection\",\"title\":\"SQL built from request input\",\"body\":\"the handler concatenates the id parameter into the query\",\"failure_scenario\":\"id=1 OR 1=1 returns every user\",\"suggestion\":\"use a bound parameter\",\"confidence\":9}]}\n",
            "exit": 0
          },
          {
            "argv": [
              "run",
              "--standalone",
              "--agent",
              "rival-china",
              "-m",
              "moonshot/kimi-k3.1-pro"
            ],
            "times": 1,
            "expect": {
              "stdin": {
                "$regex": "(?s:.*)\n## Task: Edit the wording of a review\n(?s:.*)"
              },
              "cwd": "<ROOT>/work",
              "env": {
                "OPENCODE_CONFIG_CONTENT": "{\"$schema\":\"https://opencode.ai/config.json\",\"agent\":{\"rival-china\":{\"mode\":\"primary\",\"permission\":{\"*\":\"deny\",\"external_directory\":\"deny\",\"glob\":\"allow\",\"grep\":\"allow\",\"list\":\"allow\",\"read\":\"allow\"}}},\"permission\":{\"*\":\"deny\",\"external_directory\":\"deny\",\"glob\":\"allow\",\"grep\":\"allow\",\"list\":\"allow\",\"read\":\"allow\"},\"provider\":{\"moonshot\":{\"models\":{\"kimi-k3.1-pro\":{\"options\":{\"reasoningEffort\":\"low\"}}}}}}",
                "OPENCODE_DISABLE_PROJECT_CONFIG": "1",
                "OPENCODE_DB": null,
                "OPENCODE_PERMISSION": null
              }
            },
            "stdout": "{\"summary\":\"One injectable query.\",\"findings\":[{\"file\":\"src/api/users.go\",\"line\":42,\"severity\":\"high\",\"category\":\"injection\",\"title\":\"SQL built from request input\",\"body\":\"the handler concatenates the id parameter into the query\",\"failure_scenario\":\"id=1 OR 1=1 returns every user\",\"suggestion\":\"use a bound parameter\",\"confidence\":9}]}\n",
            "exit": 0
          }
        ]
      }
    }
  },
  "steps": [
    {
      "run": [
        "command",
        "security"
      ],
      "stdin": "src/api/",
      "expect": {
        "exit_code": 0,
        "stdout": "\n═══ RIVAL SECURITY REVIEW ═══\n\nModel: kimi-k3.1-pro\nScope: src/api/\n\nSummary: One injectable query.\n\n1. [high] SQL built from request input — src/api/users.go:42\n   the handler concatenates the id parameter into the query\n   Scenario: id=1 OR 1=1 returns every user\n   Fix: use a bound parameter\n   (injection, confidence 9)\n\nFindings: 1 total — 0 crit, 1 high, 0 med, 0 low\n",
        "stderr_lines": [],
        "log_events": [
          {
            "level": "info",
            "message": "starting security reviewer",
            "fields": {
