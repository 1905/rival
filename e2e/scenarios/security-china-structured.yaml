        "text": "{\"summary\":\"One injectable query.\",\"findings\":[{\"file\":\"src/api/users.go\",\"line\":42,\"severity\":\"high\",\"category\":\"injection\",\"title\":\"SQL built from request input\",\"body\":\"the handler concatenates the id parameter into the query\",\"failure_scenario\":\"id=1 OR 1=1 returns every user\",\"suggestion\":\"use a bound parameter\",\"confidence\":9}]}\n"
      }
