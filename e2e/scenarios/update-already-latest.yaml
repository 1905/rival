{
  "name": "update-already-latest",
  "description": "`rival update` prints 'Checking for updates... ' (no newline). The fake release server answers tag vdev, which equals the running 'dev' version, so it prints 'already on latest (vdev)' and force-reinstalls the embedded skills for both hosts. The codex fake is on PATH, so both hosts install (no 'Codex not detected' note; only `rival install` prints that). brew is never called. A second update skips all matching skill versions instead of force-rewriting them.",
  "normalise": [
    {
      "regex": "v(\\d+\\.\\d+\\.\\d+)",
      "kind": "replace",
      "replace": "<V>"
    }
  ],
  "steps": [
    {
      "run": [
        "update"
      ],
      "expect": {
        "exit_code": 0,
        "stdout": "Checking for updates... already on latest (vdev)\nInstalling claude skills to <HOME>/.claude/skills\n\n  ✓ rival — installed (v<V>)\n  ✓ china — installed (v<V>)\n\nDone: 2 installed, 0 updated, 0 up to date, 0 removed\nInstalling codex skills to <HOME>/.agents/skills\n\n  ✓ rival — installed (v<V>)\n  ✓ china — installed (v<V>)\n\nDone: 2 installed, 0 updated, 0 up to date, 0 removed\n",
        "stderr_lines": [],
        "log_events": []
      }
    },
    {
      "run": [
        "update"
      ],
      "expect": {
        "exit_code": 0,
        "stdout": "Checking for updates... already on latest (vdev)\nInstalling claude skills to <HOME>/.claude/skills\n\n  · rival — already up to date (v<V>)\n  · china — already up to date (v<V>)\n\nDone: 0 installed, 0 updated, 2 up to date, 0 removed\nInstalling codex skills to <HOME>/.agents/skills\n\n  · rival — already up to date (v<V>)\n  · china — already up to date (v<V>)\n\nDone: 0 installed, 0 updated, 2 up to date, 0 removed\n",
        "stderr_lines": [],
        "log_events": []
      }
    }
  ],
  "expect": {
    "home_files": [
      ".agents/skills/china/SKILL.md",
      ".agents/skills/rival/SKILL.md",
      ".claude/skills/china/SKILL.md",
      ".claude/skills/rival/SKILL.md"
    ],
    "http_requests": [
      {
        "method": "GET",
        "path": "/repos/1905/rival/releases/latest"
      },
      {
        "method": "GET",
        "path": "/repos/1905/rival/releases/latest"
      }
    ]
  },
  "update_server": {
    "routes": {
      "/repos/1905/rival/releases/latest": {
        "status": 200,
        "json": {
          "tag_name": "vdev"
        }
      }
    }
  }
}
