{
  "name": "review-language-security",
  "description": "`rival command security` (china, max effort). The security review text has flagged words, so the same model makes ONE repair call at low effort with the read-only profile and its own log. The printed security review is the repaired one; the session log ends with the repaired review.",
  "fakes": {
    "scripts": {
      "opencode": {
        "responses": [
          {
            "argv": [
              "--version"
            ],
            "times": 1,
            "stdout": "opencode v2.1.4\n",
            "exit": 0
          },
          {
            "argv": [
              "run",
              "--standalone",
              "--agent",
              "rival-china",
              "-m",
              "moonshot/kimi-k3.1-pro"
            ],
            "times": 1,
            "expect": {
              "stdin": {
                "$regex": "Answer the user's question directly\\. Do not offer follow-up options, menus, walkthroughs, or ask if they want more\\. No filler, no sign-offs\\. Just deliver the answer and stop\\.\n\nYou are working in project directory: <ROOT>/work\nUse your tools to read files, run git commands, and explore the codebase as needed\\.\n\nReview scope: src/api/\n\n## Role: Security Reviewer\n(?s:.*)"
              },
              "cwd": "<ROOT>/work",
              "env": {
                "OPENCODE_CONFIG_CONTENT": "{\"$schema\":\"https://opencode.ai/config.json\",\"agent\":{\"rival-china\":{\"mode\":\"primary\",\"permission\":{\"*\":\"deny\",\"external_directory\":\"deny\",\"glob\":\"allow\",\"grep\":\"allow\",\"list\":\"allow\",\"read\":\"allow\"}}},\"permission\":{\"*\":\"deny\",\"external_directory\":\"deny\",\"glob\":\"allow\",\"grep\":\"allow\",\"list\":\"allow\",\"read\":\"allow\"},\"provider\":{\"moonshot\":{\"models\":{\"kimi-k3.1-pro\":{\"options\":{\"reasoningEffort\":\"max\"}}}}}}",
                "OPENCODE_DISABLE_PROJECT_CONFIG": "1",
                "OPENCODE_DB": null,
                "OPENCODE_PERMISSION": null
              }
            },
            "stdout": "{\"summary\":\"We utilize the cache.\",\"findings\":[{\"file\":\"src/a.go\",\"line\":3,\"severity\":\"high\",\"category\":\"bug\",\"title\":\"Cache key is wrong\",\"body\":\"The code in `load()` reads 3 entries. Ensure the key is unique.\",\"suggestion\":\"Return an error.\",\"confidence\":9}]}\n",
            "exit": 0
          },
          {
            "argv": [
              "run",
              "--standalone",
              "--agent",
              "rival-china",
              "-m",
              "moonshot/kimi-k3.1-pro"
            ],
            "times": 1,
            "expect": {
              "stdin": {
                "$regex": "(?s:.*)\n## Task: Edit the wording of a review\n(?s:.*)"
              },
              "cwd": "<ROOT>/work",
              "env": {
                "OPENCODE_CONFIG_CONTENT": "{\"$schema\":\"https://opencode.ai/config.json\",\"agent\":{\"rival-china\":{\"mode\":\"primary\",\"permission\":{\"*\":\"deny\",\"external_directory\":\"deny\",\"glob\":\"allow\",\"grep\":\"allow\",\"list\":\"allow\",\"read\":\"allow\"}}},\"permission\":{\"*\":\"deny\",\"external_directory\":\"deny\",\"glob\":\"allow\",\"grep\":\"allow\",\"list\":\"allow\",\"read\":\"allow\"},\"provider\":{\"moonshot\":{\"models\":{\"kimi-k3.1-pro\":{\"options\":{\"reasoningEffort\":\"low\"}}}}}}",
                "OPENCODE_DISABLE_PROJECT_CONFIG": "1",
                "OPENCODE_DB": null,
                "OPENCODE_PERMISSION": null
              }
            },
            "stdout": "{\"summary\":\"We use the cache.\",\"findings\":[{\"file\":\"src/a.go\",\"line\":3,\"severity\":\"high\",\"category\":\"bug\",\"title\":\"Cache key is wrong\",\"body\":\"The code in `load()` reads 3 entries. Make sure that the key is unique.\",\"suggestion\":\"Return an error.\",\"confidence\":9}]}\n",
            "exit": 0
          }
        ]
      }
    }
  },
  "steps": [
    {
      "run": [
        "command",
        "security"
      ],
      "stdin": "src/api/",
      "expect": {
        "exit_code": 0,
        "stdout": "\n═══ RIVAL SECURITY REVIEW ═══\n\nModel: kimi-k3.1-pro\nScope: src/api/\n\nSummary: We use the cache.\n\n1. [high] Cache key is wrong — src/a.go:3\n   The code in `load()` reads 3 entries. Make sure that the key is unique.\n   Fix: Return an error.\n   (bug, confidence 9)\n\nFindings: 1 total — 0 crit, 1 high, 0 med, 0 low\n",
        "stderr_lines": [],
        "log_events": [
          {
            "level": "info",
            "message": "starting security reviewer",
            "fields": {
              "session": "<UUID1>",
              "model": "kimi-k3.1-pro"
            }
          }
        ]
      }
    }
  ],
  "expect": {
    "home_files": [
      ".rival/queue/.lock",
      ".rival/sessions/<UUID1>.json",
      ".rival/sessions/<UUID1>.log",
      ".rival/sessions/<UUID1>.log.repair.log"
    ],
    "files": [
      {
        "path": "<HOME>/.rival/sessions/<UUID1>.json",
        "json": {
          "status": "completed",
          "exit_code": 0,
          "cli": "china",
          "model": "moonshot/kimi-k3.1-pro",
          "effort": "max",
          "mode": "security",
          "review_scope": "src/api/",
          "work_dir": "<ROOT>/work",
          "output_lines": 1
        }
      },
      {
        "path": "<HOME>/.rival/sessions/<UUID1>.log",
        "text": "{\"summary\":\"We utilize the cache.\",\"findings\":[{\"file\":\"src/a.go\",\"line\":3,\"severity\":\"high\",\"category\":\"bug\",\"title\":\"Cache key is wrong\",\"body\":\"The code in `load()` reads 3 entries. Ensure the key is unique.\",\"suggestion\":\"Return an error.\",\"confidence\":9}]}\n\n{\"summary\":\"We use the cache.\",\"findings\":[{\"file\":\"src/a.go\",\"line\":3,\"severity\":\"high\",\"category\":\"bug\",\"title\":\"Cache key is wrong\",\"body\":\"The code in `load()` reads 3 entries. Make sure that the key is unique.\",\"suggestion\":\"Return an error.\",\"confidence\":9}]}\n"
      }
    ],
    "calls": {
      "opencode": 3
    }
  }
}
