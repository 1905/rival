{
  "name": "proxy-claude-review",
  "description": "`rival command claude` review through the proxy. The config enables proxy.claude with prefix emcd_; RIVAL_PROXY_URL points at the scenario server and RIVAL_PROXY_KEY holds a fixed test key. The preflight asks GET /v1/models once with `Authorization: Bearer <key>` (the route answers 401 to any other key). The fake claude sees `--model emcd_/claude-opus-5-5` for the review and the language repair pass, ANTHROPIC_BASE_URL and ANTHROPIC_API_KEY in its env, and none of the inherited ANTHROPIC_AUTH_TOKEN, ANTHROPIC_DEFAULT_OPUS_MODEL, CLAUDE_CODE_USE_BEDROCK or CLAUDECODE. RIVAL_CLAUDE_AUTH=api is ignored (debug line). The session keeps the bare model and records route proxy, wire_model and account proxy; the key is in no argv.",
  "fakes": {
    "scripts": {
      "claude": {
        "responses": [
          {
            "argv": [
              "-p",
              "--model",
              "emcd_/claude-opus-5-5",
              "--effort",
              "medium",
              "--output-format",
              "text",
              "--no-session-persistence",
              "--system-prompt",
              "Answer the user's question directly. Do not offer follow-up options, menus, walkthroughs, or ask if they want more. No filler, no sign-offs. Just deliver the answer and stop.",
              "--safe-mode",
              "--setting-sources",
              "",
              "--settings",
              "{\"disableAllHooks\":true}",
              "--strict-mcp-config",
              "--mcp-config",
              "{\"mcpServers\":{}}",
              "--tools",
              "Read,Glob,Grep",
              "--allowedTools",
              "Read,Glob,Grep",
              "--disallowedTools",
              "mcp__*",
              "--permission-mode",
              "dontAsk"
            ],
            "times": 1,
            "expect": {
              "stdin": {
                "$regex": "You are working in project directory: <ROOT>/work\nUse your tools to read files, run git commands, and explore the codebase as needed\\.\n\nReview scope: src/\n\n## Role: Implementation Bug Hunter\n(?s:.*)"
              },
              "cwd": "<ROOT>/work",
              "env": {
                "ANTHROPIC_BASE_URL": {
                  "$regex": "http://127\\.0\\.0\\.1:[0-9]+"
                },
                "ANTHROPIC_API_KEY": "test-proxy-key-0000",
                "ANTHROPIC_AUTH_TOKEN": null,
                "ANTHROPIC_DEFAULT_OPUS_MODEL": null,
                "ANTHROPIC_DEFAULT_SONNET_MODEL": null,
                "ANTHROPIC_DEFAULT_HAIKU_MODEL": null,
                "CLAUDE_CODE_USE_BEDROCK": null,
                "CLAUDE_CODE_USE_VERTEX": null,
                "CLAUDECODE": null,
                "RIVAL_PROXY_KEY": null
              }
            },
            "stdout": "{\"summary\":\"Looks fine.\",\"findings\":[]}\n",
            "exit": 0
          },
          {
            "argv": [
              "-p",
              "--model",
              "emcd_/claude-opus-5-5",
              "--effort",
              "low",
              "--output-format",
              "text",
              "--no-session-persistence",
              "--system-prompt",
              "Answer the user's question directly. Do not offer follow-up options, menus, walkthroughs, or ask if they want more. No filler, no sign-offs. Just deliver the answer and stop.",
              "--safe-mode",
              "--setting-sources",
              "",
              "--settings",
              "{\"disableAllHooks\":true}",
              "--strict-mcp-config",
              "--mcp-config",
              "{\"mcpServers\":{}}",
              "--tools",
              "Read,Glob,Grep",
              "--allowedTools",
              "Read,Glob,Grep",
              "--disallowedTools",
              "mcp__*",
              "--permission-mode",
              "dontAsk"
            ],
            "times": 1,
            "expect": {
              "stdin": {
                "$regex": "(?s:.*)\n## Task: Edit the wording of a review\n(?s:.*)"
              },
              "cwd": "<ROOT>/work",
              "env": {
                "ANTHROPIC_BASE_URL": {
                  "$regex": "http://127\\.0\\.0\\.1:[0-9]+"
                },
                "ANTHROPIC_API_KEY": "test-proxy-key-0000",
                "ANTHROPIC_AUTH_TOKEN": null,
                "ANTHROPIC_DEFAULT_OPUS_MODEL": null,
                "ANTHROPIC_DEFAULT_SONNET_MODEL": null,
                "ANTHROPIC_DEFAULT_HAIKU_MODEL": null,
                "CLAUDE_CODE_USE_BEDROCK": null,
                "CLAUDE_CODE_USE_VERTEX": null,
                "CLAUDECODE": null,
                "RIVAL_PROXY_KEY": null
              }
            },
            "stdout": "{\"summary\":\"Looks fine.\",\"findings\":[]}\n",
            "exit": 0
          }
        ]
      }
    }
  },
  "env": {
    "CLAUDECODE": "1",
    "ANTHROPIC_API_KEY": "sk-parity-must-not-leak",
    "ANTHROPIC_AUTH_TOKEN": "sk-parity-token-must-not-leak",
    "ANTHROPIC_BASE_URL": "https://elsewhere.invalid",
    "ANTHROPIC_DEFAULT_OPUS_MODEL": "other-model",
    "CLAUDE_CODE_USE_BEDROCK": "1",
    "RIVAL_CLAUDE_AUTH": "api",
    "RIVAL_PROXY_URL": "<SERVER>",
    "RIVAL_PROXY_KEY": "test-proxy-key-0000"
  },
  "fixtures": [
    {
      "write": "home/.rival/config.yaml",
      "text": "proxy:\n  claude:\n    enabled: true\n    model_prefix: emcd_\n"
    }
  ],
  "update_server": {
    "routes": {
      "/v1/models": {
        "status": 200,
        "auth": "Bearer test-proxy-key-0000",
        "json": {
          "object": "list",
          "data": [
            {
              "id": "emcd_/claude-opus-5-5",
              "owned_by": "anthropic"
            },
            {
              "id": "emcd2_/claude-opus-5-5",
              "owned_by": "anthropic"
            },
            {
              "id": "gpt-6-astra",
              "owned_by": "openai"
            }
          ]
        }
      }
    }
  },
  "steps": [
    {
      "run": [
        "command",
        "claude"
      ],
      "stdin": "review src/",
      "expect": {
        "exit_code": 0,
        "stdout": "\n═══ RIVAL REVIEW ═══\n\nModel: claude (claude-opus-5-5)\nScope: src/\n\nSummary: Looks fine.\n\nNo issues found.\nLog: <HOME>/.rival/sessions/<UUID1>.log\n",
        "stderr_lines": [],
        "log_events": [
          {
            "level": "info",
            "message": "starting claude (command mode)",
            "fields": {
              "session": "<UUID1>",
              "effort": "medium",
              "mode": "review"
            }
          },
          {
            "level": "debug",
            "message": "proxy route wins over RIVAL_CLAUDE_AUTH",
            "fields": {
              "session": "<UUID1>"
            }
          },
          {
            "level": "info",
            "message": "model native auth mode",
            "fields": {
              "session": "<UUID1>",
              "auth": "proxy",
              "model": "claude"
            }
          },
          {
            "level": "debug",
            "message": "proxy route wins over RIVAL_CLAUDE_AUTH",
            "fields": {
              "session": "<UUID1>"
            }
          },
          {
            "level": "info",
            "message": "model native auth mode",
            "fields": {
              "session": "<UUID1>",
              "auth": "proxy",
              "model": "claude"
            }
          }
        ]
      }
    }
  ],
  "expect": {
    "home_files": [
      ".rival/config.yaml",
      ".rival/queue/.lock",
      ".rival/sessions/<UUID1>.json",
      ".rival/sessions/<UUID1>.log",
      ".rival/sessions/<UUID1>.log.repair.log"
    ],
    "files": [
      {
        "path": "<HOME>/.rival/sessions/<UUID1>.json",
        "json": {
          "status": "completed",
          "exit_code": 0,
          "cli": "claude",
          "model": "claude-opus-5-5",
          "mode": "native",
          "review_scope": "src/",
          "account": "proxy",
          "route": "proxy",
          "wire_model": "emcd_/claude-opus-5-5"
        }
      }
    ],
    "calls": {
      "claude": 2
    },
    "http_requests": [
      {
        "method": "GET",
        "path": "/v1/models"
      }
    ]
  }
}
