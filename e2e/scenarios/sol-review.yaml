{
  "name": "sol-review",
  "description": "`rival command sol` review, direct (no proxy block). The preflight runs `codex login status`. The fake codex sees `-m gpt-6.1-sol` with the Codex default effort (xhigh) for the review and low for the language repair pass, and no provider -c values. The session records the bare Sol id with cli codex; the output names the reviewer `sol`.",
  "fakes": {
    "scripts": {
      "codex": {
        "responses": [
          {
            "argv": [
              "login",
              "status"
            ],
            "times": 1,
            "stdout": "Logged in using ChatGPT\n",
            "exit": 0
          },
          {
            "argv": [
              "exec",
              "-C",
              "<ROOT>/work",
              "-m",
              "gpt-6.1-sol",
              "-c",
              "model_reasoning_effort=xhigh",
              "--sandbox",
              "read-only",
              "--ephemeral",
              "--skip-git-repo-check",
              "--color",
              "never",
              "-"
            ],
            "times": 1,
            "expect": {
              "stdin": {
                "$regex": "(?s:.*)You are working in project directory: <ROOT>/work\n(?s:.*)Review scope: src/\n(?s:.*)"
              },
              "cwd": "<ROOT>/work",
              "env": {
                "RIVAL_PROXY_KEY": null
              }
            },
            "stdout": "{\"summary\":\"Looks fine.\",\"findings\":[]}\n",
            "exit": 0
          },
          {
            "argv": [
              "exec",
              "-C",
              "<ROOT>/work",
              "-m",
              "gpt-6.1-sol",
              "-c",
              "model_reasoning_effort=low",
              "--sandbox",
              "read-only",
              "--ephemeral",
              "--skip-git-repo-check",
              "--color",
              "never",
              "-"
            ],
            "times": 1,
            "expect": {
              "stdin": {
                "$regex": "(?s:.*)\n## Task: Edit the wording of a review\n(?s:.*)"
              },
              "cwd": "<ROOT>/work",
              "env": {
                "RIVAL_PROXY_KEY": null
              }
            },
            "stdout": "{\"summary\":\"Looks fine.\",\"findings\":[]}\n",
            "exit": 0
          }
        ]
      }
    }
  },
  "steps": [
    {
      "run": [
        "command",
        "sol"
      ],
      "stdin": "review src/",
      "expect": {
        "exit_code": 0,
        "stdout": "\n═══ RIVAL REVIEW ═══\n\nModel: sol (gpt-6.1-sol)\nScope: src/\n\nSummary: Looks fine.\n\nNo issues found.\nLog: <HOME>/.rival/sessions/<UUID1>.log\n",
        "stderr_lines": [],
        "log_events": [
          {
            "level": "info",
            "message": "starting sol (command mode)",
            "fields": {
              "session": "<UUID1>",
              "effort": "xhigh",
              "mode": "review"
            }
          }
        ]
      }
    }
  ],
  "expect": {
    "home_files": [
      ".rival/queue/.lock",
      ".rival/sessions/<UUID1>.json",
      ".rival/sessions/<UUID1>.log",
      ".rival/sessions/<UUID1>.log.repair.log"
    ],
    "files": [
      {
        "path": "<HOME>/.rival/sessions/<UUID1>.json",
        "json": {
          "status": "completed",
          "exit_code": 0,
          "cli": "codex",
          "model": "gpt-6.1-sol",
          "review_scope": "src/"
        }
      }
    ],
    "calls": {
      "codex": 3
    }
  }
}
