{
  "name": "security-which-ready",
  "description": "`rival command security --which` with no china.model configured. The preflight runs `opencode --version` once (v2). Stdout shows the china model, 'Config: china.model = moonshot/kimi-k3.1-pro (default)', the effort, the auth note and 'Ready.'. Stdin is never read and no review starts.",
  "fakes": {
    "scripts": {
      "opencode": {
        "responses": [
          {
            "argv": [
              "--version"
            ],
            "times": 1,
            "stdout": "opencode v2.1.4\n",
            "exit": 0
          }
        ]
      }
    }
  },
  "steps": [
    {
      "run": [
        "command",
        "security",
        "--which"
      ],
      "stdin": "src/api/",
      "expect": {
        "exit_code": 0,
        "stdout": "Security reviewer: china (kimi-k3.1-pro)\nConfig: china.model = moonshot/kimi-k3.1-pro (default)\nReasoning effort: max\nAuth: opencode's own (opencode auth login or its config)\n\nReady.\n",
        "stderr_lines": [],
        "log_events": []
      }
    }
  ],
  "expect": {
    "home_files": [],
    "calls": {
      "opencode": 1
    }
  }
}
