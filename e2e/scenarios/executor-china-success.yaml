{
  "name": "executor-china-success",
  "description": "`rival command china` with a raw prompt on stdin, china.model set to an OpenRouter model, and a fake opencode v2 that exits 0. The preflight runs `opencode --version`. Checks the exact argv (`run --standalone --agent rival-china -m <china.model>`), stdin, cwd and env: the full-auto profile and the model's effort (max, the default) in OPENCODE_CONFIG_CONTENT, OPENCODE_DISABLE_PROJECT_CONFIG=1, no OPENCODE_DB, and the raw-mode credential strip (OPENAI_API_KEY, AWS_*). The plain log is left unchanged and the session completes.",
  "fakes": {
    "scripts": {
      "opencode": {
        "responses": [
          {
            "argv": [
              "--version"
            ],
            "times": 1,
            "stdout": "opencode v2.1.4\n",
            "exit": 0
          },
          {
            "argv": [
              "run",
              "--standalone",
              "--agent",
              "rival-china",
              "-m",
              "openrouter/z-ai/glm-5.3"
            ],
            "times": 1,
            "expect": {
              "stdin": "Answer the user's question directly. Do not offer follow-up options, menus, walkthroughs, or ask if they want more. No filler, no sign-offs. Just deliver the answer and stop.\n\nYou are working in project directory: <ROOT>/work\nUse your tools to read files, run git commands, and explore the codebase as needed.\n\nexplain the auth flow",
              "cwd": "<ROOT>/work",
              "env": {
                "OPENCODE_CONFIG_CONTENT": "{\"$schema\":\"https://opencode.ai/config.json\",\"agent\":{\"rival-china\":{\"mode\":\"primary\",\"permission\":{\"bash\":\"allow\",\"edit\":\"allow\",\"external_directory\":\"deny\",\"glob\":\"allow\",\"grep\":\"allow\",\"list\":\"allow\",\"read\":\"allow\",\"task\":\"allow\",\"webfetch\":\"allow\",\"websearch\":\"allow\"}}},\"permission\":{\"bash\":\"allow\",\"edit\":\"allow\",\"external_directory\":\"deny\",\"glob\":\"allow\",\"grep\":\"allow\",\"list\":\"allow\",\"read\":\"allow\",\"task\":\"allow\",\"webfetch\":\"allow\",\"websearch\":\"allow\"},\"provider\":{\"openrouter\":{\"models\":{\"z-ai/glm-5.3\":{\"options\":{\"reasoningEffort\":\"max\"}}}}}}",
                "OPENCODE_DISABLE_PROJECT_CONFIG": "1",
                "OPENCODE_DB": null,
                "OPENCODE_PERMISSION": null,
                "OPENAI_API_KEY": null,
                "AWS_PROFILE": null
              }
            },
            "stdout": "A done\n",
            "exit": 0
          }
        ]
      }
    }
  },
  "env": {
    "OPENAI_API_KEY": "sk-parity",
    "AWS_PROFILE": "parity"
  },
  "fixtures": [
    {
      "write": "home/.rival/config.yaml",
      "text": "china:\n  model: openrouter/z-ai/glm-5.3\n"
    }
  ],
  "steps": [
    {
      "run": [
        "command",
        "china"
      ],
      "stdin": "explain the auth flow",
      "expect": {
        "exit_code": 0,
        "stdout": "A done\n",
        "stderr_lines": [],
        "log_events": [
          {
            "level": "info",
            "message": "starting china (command mode)",
            "fields": {
              "session": "<UUID1>",
              "effort": "max",
              "mode": "raw"
            }
          }
        ]
      }
    }
  ],
  "expect": {
    "home_files": [
      ".rival/config.yaml",
      ".rival/queue/.lock",
      ".rival/sessions/<UUID1>.json",
      ".rival/sessions/<UUID1>.log"
    ],
    "files": [
      {
        "path": "<HOME>/.rival/sessions/<UUID1>.json",
        "json": {
          "status": "completed",
          "exit_code": 0,
          "cli": "china",
          "model": "openrouter/z-ai/glm-5.3",
          "effort": "max",
          "mode": "raw",
          "work_dir": "<ROOT>/work",
          "output_bytes": 7,
          "output_lines": 1
        }
      },
      {
        "path": "<HOME>/.rival/sessions/<UUID1>.log",
        "text": "A done\n"
      }
    ],
    "calls": {
      "opencode": 2
    }
  }
}
