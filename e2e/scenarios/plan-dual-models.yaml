{
  "name": "plan-dual-models",
  "description": "`rival command plan -m codex,claude --effort high` with `plan.md` on stdin. Models keep the requested order (codex, claude). The explicit --effort applies to both sessions, so both record effort high: codex gets `-c model_reasoning_effort=high` and claude gets `--effort max` (high maps to max for claude). Two plan sessions share one group and ONE queue ticket and run concurrently. Stdout is the multi-model plan review: header '(codex + claude)', a File line, then a block per model in request order. Exit code is 0 and the ticket is released, leaving the lock file.",
  "fakes": {
    "scripts": {
      "codex": {
        "responses": [
          {
            "argv": [
              "login",
              "status"
            ],
            "times": 1,
            "stdout": "Logged in using ChatGPT\n",
            "exit": 0
          },
          {
            "argv": [
              "exec",
              "-C",
              "<ROOT>/work",
              "-m",
              "gpt-6-astra",
              "-c",
              "model_reasoning_effort=high",
              "--sandbox",
              "read-only",
              "--ephemeral",
              "--skip-git-repo-check",
              "--color",
              "never",
              "-"
            ],
            "times": 1,
            "expect": {
              "stdin": {
                "$regex": "Answer\\ the\\ user's\\ question\\ directly\\.\\ Do\\ not\\ offer\\ follow\\-up\\ options,\\ menus,\\ walkthroughs,\\ or\\ ask\\ if\\ they\\ want\\ more\\.\\ No\\ filler,\\ no\\ sign\\-offs\\.\\ Just\\ deliver\\ the\\ answer\\ and\\ stop\\.\n\nYou are working in project directory: <ROOT>/work\nUse your tools to read files, run git commands, and explore the codebase as needed\\.\n\nYou review an engineering PLAN / SPEC document \\(not source code\\)\\.[^\n]*\n\nPlan document to review: <ROOT>/work/plan\\.md\n(?s:.*)"
              },
              "cwd": "<ROOT>/work"
            },
            "stdout": "{\"summary\":\"Codex view.\",\"rating\":7,\"findings\":[{\"file\":\"Rollout\",\"line\":12,\"severity\":\"high\",\"category\":\"gap\",\"title\":\"no rollback step\",\"body\":\"the plan never says how to revert the migration\",\"suggestion\":\"add a down migration\",\"confidence\":9}]}\n",
            "exit": 0
          },
          {
            "argv": [
              "exec",
              "-C",
              "<ROOT>/work",
              "-m",
              "gpt-6-astra",
              "-c",
              "model_reasoning_effort=low",
              "--sandbox",
              "read-only",
              "--ephemeral",
              "--skip-git-repo-check",
              "--color",
              "never",
              "-"
            ],
            "times": 1,
            "expect": {
              "stdin": {
                "$regex": "(?s:.*)\n## Task: Edit the wording of a review\n(?s:.*)"
              },
              "cwd": "<ROOT>/work"
            },
            "stdout": "{\"summary\":\"Codex view.\",\"rating\":7,\"findings\":[{\"file\":\"Rollout\",\"line\":12,\"severity\":\"high\",\"category\":\"gap\",\"title\":\"no rollback step\",\"body\":\"the plan never says how to revert the migration\",\"suggestion\":\"add a down migration\",\"confidence\":9}]}\n",
            "exit": 0
          }
        ]
      },
      "claude": {
        "responses": [
          {
            "argv": [
              "-p",
              "--model",
              "claude-opus-5-5",
              "--effort",
              "max",
              "--output-format",
              "text",
              "--no-session-persistence",
              "--system-prompt",
              "Answer the user's question directly. Do not offer follow-up options, menus, walkthroughs, or ask if they want more. No filler, no sign-offs. Just deliver the answer and stop.",
              "--safe-mode",
              "--setting-sources",
              "",
              "--settings",
              "{\"disableAllHooks\":true}",
              "--strict-mcp-config",
              "--mcp-config",
              "{\"mcpServers\":{}}",
              "--tools",
              "Read,Glob,Grep",
              "--allowedTools",
              "Read,Glob,Grep",
              "--disallowedTools",
              "mcp__*",
              "--permission-mode",
              "dontAsk"
            ],
            "times": 1,
            "expect": {
              "stdin": {
                "$regex": "You are working in project directory: <ROOT>/work\nUse your tools to read files, run git commands, and explore the codebase as needed\\.\n\nYou review an engineering PLAN / SPEC document \\(not source code\\)\\.[^\n]*\n\nPlan document to review: <ROOT>/work/plan\\.md\n(?s:.*)"
              },
              "cwd": "<ROOT>/work"
            },
            "stdout": "{\"summary\":\"Claude view.\",\"rating\":9,\"findings\":[]}\n",
            "exit": 0
          }
        ]
      }
    }
  },
  "fixtures": [
    {
      "write": "work/plan.md",
      "text": "# Plan\n\nAdd a column, then ship.\n"
    }
  ],
  "steps": [
    {
      "run": [
        "command",
        "plan",
        "-m",
        "codex,claude",
        "--effort",
        "high"
      ],
      "stdin": "plan.md",
      "expect": {
        "exit_code": 0,
        "stdout": "\n═══ RIVAL PLAN REVIEW (codex + claude) ═══\n\nFile: <ROOT>/work/plan.md\n\n── codex ──\n\nRating: 7/10\n\nSummary: Codex view.\n\n1. [high] no rollback step — Rollout:12\n   the plan never says how to revert the migration\n   Fix: add a down migration\n   (gap, confidence 9)\n\nFindings: 1 total — 0 crit, 1 high, 0 med, 0 low\n\n\n── claude ──\n\nRating: 9/10\n\nSummary: Claude view.\n\nNo bugs or gaps found.\n",
        "stderr_lines": [],
        "log_events": [
          {
            "level": "info",
            "message": "starting plan reviewer",
            "fields": {
              "session": "<ID:CODEX>",
              "reviewer": "codex"
            }
          },
          {
            "level": "info",
            "message": "starting plan reviewer",
            "fields": {
              "session": "<ID:CLAUDE>",
              "reviewer": "claude"
            }
          },
          {
            "level": "info",
            "message": "model native auth mode",
            "fields": {
              "session": "<ID:CLAUDE>",
              "auth": "subscription",
              "model": "claude"
            }
          }
        ]
      }
    }
  ],
  "expect": {
    "home_files": [
      ".rival/queue/.lock",
      ".rival/sessions/<ID:CODEX>.json",
      ".rival/sessions/<ID:CODEX>.log",
      ".rival/sessions/<ID:CODEX>.log.repair.log",
      ".rival/sessions/<ID:CLAUDE>.json",
      ".rival/sessions/<ID:CLAUDE>.log"
    ],
    "files": [
      {
        "glob": "<HOME>/.rival/sessions/*.json",
        "where": {
          "cli": "codex"
        },
        "bind": {
          "CODEX": "id",
          "GROUP": "group_id"
        },
        "json": {
          "status": "completed",
          "exit_code": 0,
          "mode": "plan",
          "review_scope": "<ROOT>/work/plan.md",
          "work_dir": "<ROOT>/work",
          "group_id": "<ID:GROUP>",
          "output_lines": 0,
          "id": "<ID:CODEX>",
          "cli": "codex",
          "model": "gpt-6-astra",
          "effort": "high",
          "output_bytes": 249
        }
      },
      {
        "glob": "<HOME>/.rival/sessions/*.json",
        "where": {
          "cli": "claude"
        },
        "bind": {
          "CLAUDE": "id",
          "GROUP": "group_id"
        },
        "json": {
          "status": "completed",
          "exit_code": 0,
          "mode": "plan",
          "review_scope": "<ROOT>/work/plan.md",
          "work_dir": "<ROOT>/work",
          "group_id": "<ID:GROUP>",
          "output_lines": 0,
          "id": "<ID:CLAUDE>",
          "cli": "claude",
          "model": "claude-opus-5-5",
          "effort": "high",
          "account": "subscription",
          "output_bytes": 52
        }
      },
      {
        "path": "<HOME>/.rival/sessions/<ID:CODEX>.log",
        "text": "{\"summary\":\"Codex view.\",\"rating\":7,\"findings\":[{\"file\":\"Rollout\",\"line\":12,\"severity\":\"high\",\"category\":\"gap\",\"title\":\"no rollback step\",\"body\":\"the plan never says how to revert the migration\",\"suggestion\":\"add a down migration\",\"confidence\":9}]}\n"
      },
      {
        "path": "<HOME>/.rival/sessions/<ID:CLAUDE>.log",
        "text": "{\"summary\":\"Claude view.\",\"rating\":9,\"findings\":[]}\n"
      }
    ],
    "calls": {
      "codex": 3,
      "claude": 1
    }
  }
}
