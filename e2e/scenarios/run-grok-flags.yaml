{
  "name": "run-grok-flags",
  "description": "`rival run grok` flag handling. Step 1: `--prompt-stdin --effort low --no-queue --workdir sub` maps effort low to the grok effort, passes the prompt through a temp file, runs without the review sandbox, and removes the temp file (tmp/ stays empty). Step 2: `--review src/ --no-queue --effort ultra` clamps ultra to high and adds `--sandbox read-only`. Stdout is the mirrored output followed by the formatted review. Both steps exit 0.",
  "fixtures": [
    {
      "mkdir": "work/sub"
    },
    {
      "write": "home/.grok/auth.json",
      "text": "{}\n",
      "mode": "0600"
    }
  ],
  "fakes": {
    "scripts": {
      "grok": {
        "responses": [
          {
            "argv": [
              "--prompt-file",
              {
                "$regex": "<ROOT>/tmp/rival-grok-[0-9]+\\.md"
              },
              "-m",
              "grok-4.6",
              "--effort",
              "low",
              "--output-format",
              "plain",
              "--no-auto-update",
              "--yolo",
              "--cwd",
              "<ROOT>/work/sub"
            ],
            "times": 1,
            "expect": {
              "stdin": "",
              "cwd": "<ROOT>/work/sub"
            },
            "stdout": "A done\n",
            "exit": 0
          },
          {
            "argv": [
              "--prompt-file",
              {
                "$regex": "<ROOT>/tmp/rival-grok-[0-9]+\\.md"
              },
              "-m",
              "grok-4.6",
              "--effort",
              "high",
              "--output-format",
              "plain",
              "--no-auto-update",
              "--yolo",
              "--cwd",
              "<ROOT>/work",
              "--sandbox",
              "read-only"
            ],
            "times": 1,
            "expect": {
              "stdin": "",
              "cwd": "<ROOT>/work"
            },
            "stdout": "{\"summary\":\"Looks fine.\",\"findings\":[]}\n",
            "exit": 0
          },
          {
            "argv": [
              "--prompt-file",
              {
                "$regex": "<ROOT>/tmp/rival-grok-[0-9]+\\.md"
              },
              "-m",
              "grok-4.6",
              "--effort",
              "low",
              "--output-format",
              "plain",
              "--no-auto-update",
              "--yolo",
              "--cwd",
              "<ROOT>/work",
              "--sandbox",
              "read-only"
            ],
            "times": 1,
            "expect": {
              "stdin": "",
              "cwd": "<ROOT>/work"
            },
            "stdout": "{\"summary\":\"Looks fine.\",\"findings\":[]}\n",
            "exit": 0
          }
        ]
      }
    }
  },
  "steps": [
    {
      "run": [
        "run",
        "grok",
        "--prompt-stdin",
        "--effort",
        "low",
        "--no-queue",
        "--workdir",
        "sub"
      ],
      "stdin": "explain the auth flow",
      "expect": {
        "exit_code": 0,
        "stdout": "A done\n",
        "stderr_lines": [],
        "log_events": [
          {
            "level": "info",
            "message": "starting grok",
            "fields": {
              "session": "<UUID1>",
              "effort": "low",
              "mode": "raw"
            }
          }
        ]
      }
    },
    {
      "run": [
        "run",
        "grok",
        "--review",
        "src/",
        "--no-queue",
        "--effort",
        "ultra"
      ],
      "expect": {
        "exit_code": 0,
        "stdout": "{\"summary\":\"Looks fine.\",\"findings\":[]}\n\n\n═══ RIVAL REVIEW ═══\n\nModel: grok (grok-4.6)\nScope: src/\n\nSummary: Looks fine.\n\nNo issues found.\nLog: <HOME>/.rival/sessions/<UUID2>.log\n",
        "stderr_lines": [],
        "log_events": [
          {
            "level": "info",
            "message": "starting grok",
            "fields": {
              "session": "<UUID2>",
              "effort": "high",
              "mode": "review"
            }
          }
        ]
      }
    }
  ],
  "expect": {
    "home_files": [
      ".grok/auth.json",
      ".rival/sessions/<UUID1>.json",
      ".rival/sessions/<UUID1>.log",
      ".rival/sessions/<UUID2>.json",
      ".rival/sessions/<UUID2>.log",
      ".rival/sessions/<UUID2>.log.repair.log"
    ],
    "files": [
      {
        "path": "<HOME>/.rival/sessions/<UUID1>.json",
        "json": {
          "status": "completed",
          "cli": "grok",
          "effort": "low",
          "mode": "raw",
          "work_dir": "<ROOT>/work/sub",
          "output_bytes": 7,
          "output_lines": 1
        }
      },
      {
        "path": "<HOME>/.rival/sessions/<UUID2>.json",
        "json": {
          "status": "completed",
          "cli": "grok",
          "effort": "high",
          "mode": "review",
          "review_scope": "src/",
          "work_dir": "<ROOT>/work"
        }
      }
    ],
    "dirs": [
      {
        "path": "<ROOT>/tmp",
        "entries": []
      }
    ],
    "calls": {
      "grok": 3
    }
  }
}
