{
  "name": "completion-scripts",
  "description": "`rival completion` for bash, zsh, fish and powershell, with and without `--no-descriptions`. The checks are structural: top-level commands (command, install, queue, sessions, update, version, wait, codex) and the workdir and no-queue flags appear in each script; zsh, fish and powershell carry descriptions (e.g. 'Skill-facing Codex executor') unless `--no-descriptions` is given. `completion` alone prints its help and exits 0. `completion tcsh` prints the same help with exit 0 instead of an unknown-shell error.",
  "steps": [
    {
      "run": [
        "completion"
      ],
      "expect": {
        "exit_code": 0,
        "stdout": {
          "$regex": "(?s)(?=.*\\AGenerate the autocompletion script for rival for the specified shell\\.\\n)(?=.*Usage:\\s+rival\\s+completion(?![\\w-]))(?=.*\\n\\s+bash +Generate the autocompletion script for bash)(?=.*\\n\\s+zsh +Generate the autocompletion script for zsh)(?=.*\\n\\s+fish +Generate the autocompletion script for fish)(?=.*\\n\\s+powershell +Generate the autocompletion script for powershell)(?=.*(?<![\\w-])\\-h,\\ \\-\\-help(?![\\w-])[^\\n]*(?:\\n\\s*)?[^\\n]*?help for completion).*"
        },
        "stderr_lines": [],
        "log_events": []
      }
    },
    {
      "run": [
        "completion",
        "bash"
      ],
      "expect": {
        "exit_code": 0,
        "stdout": {
          "$regex": "(?s)(?=.*\\bcommand\\b)(?=.*\\binstall\\b)(?=.*\\bqueue\\b)(?=.*\\bsessions\\b)(?=.*\\bupdate\\b)(?=.*\\bversion\\b)(?=.*\\bwait\\b)(?=.*\\bcodex\\b)(?=.*workdir)(?=.*no-queue).*"
        },
        "stderr_lines": [],
        "log_events": []
      }
    },
    {
      "run": [
        "completion",
        "bash",
        "--no-descriptions"
      ],
      "expect": {
        "exit_code": 0,
        "stdout": {
          "$regex": "(?s)(?=.*\\bcommand\\b)(?=.*\\binstall\\b)(?=.*\\bqueue\\b)(?=.*\\bsessions\\b)(?=.*\\bupdate\\b)(?=.*\\bversion\\b)(?=.*\\bwait\\b)(?=.*\\bcodex\\b)(?=.*workdir)(?=.*no-queue).*"
        },
        "stderr_lines": [],
        "log_events": []
      }
    },
    {
      "run": [
        "completion",
        "zsh"
      ],
      "expect": {
        "exit_code": 0,
        "stdout": {
          "$regex": "(?s)(?=.*\\bcommand\\b)(?=.*\\binstall\\b)(?=.*\\bqueue\\b)(?=.*\\bsessions\\b)(?=.*\\bupdate\\b)(?=.*\\bversion\\b)(?=.*\\bwait\\b)(?=.*\\bcodex\\b)(?=.*workdir)(?=.*no-queue)(?=.*Skill-facing Codex executor).*"
        },
        "stderr_lines": [],
        "log_events": []
      }
    },
    {
      "run": [
        "completion",
        "zsh",
        "--no-descriptions"
      ],
      "expect": {
        "exit_code": 0,
        "stdout": {
          "$regex": "(?s)(?=.*\\bcommand\\b)(?=.*\\binstall\\b)(?=.*\\bqueue\\b)(?=.*\\bsessions\\b)(?=.*\\bupdate\\b)(?=.*\\bversion\\b)(?=.*\\bwait\\b)(?=.*\\bcodex\\b)(?=.*workdir)(?=.*no-queue)(?!.*Skill-facing Codex executor).*"
        },
        "stderr_lines": [],
        "log_events": []
      }
    },
    {
      "run": [
        "completion",
        "fish"
      ],
      "expect": {
        "exit_code": 0,
        "stdout": {
          "$regex": "(?s)(?=.*\\bcommand\\b)(?=.*\\binstall\\b)(?=.*\\bqueue\\b)(?=.*\\bsessions\\b)(?=.*\\bupdate\\b)(?=.*\\bversion\\b)(?=.*\\bwait\\b)(?=.*\\bcodex\\b)(?=.*workdir)(?=.*no-queue)(?=.*Skill-facing Codex executor).*"
        },
        "stderr_lines": [],
        "log_events": []
      }
    },
    {
      "run": [
        "completion",
        "fish",
        "--no-descriptions"
      ],
      "expect": {
        "exit_code": 0,
        "stdout": {
          "$regex": "(?s)(?=.*\\bcommand\\b)(?=.*\\binstall\\b)(?=.*\\bqueue\\b)(?=.*\\bsessions\\b)(?=.*\\bupdate\\b)(?=.*\\bversion\\b)(?=.*\\bwait\\b)(?=.*\\bcodex\\b)(?=.*workdir)(?=.*no-queue)(?!.*Skill-facing Codex executor).*"
        },
        "stderr_lines": [],
        "log_events": []
      }
    },
    {
      "run": [
        "completion",
        "powershell"
      ],
      "expect": {
        "exit_code": 0,
        "stdout": {
          "$regex": "(?s)(?=.*\\bcommand\\b)(?=.*\\binstall\\b)(?=.*\\bqueue\\b)(?=.*\\bsessions\\b)(?=.*\\bupdate\\b)(?=.*\\bversion\\b)(?=.*\\bwait\\b)(?=.*\\bcodex\\b)(?=.*workdir)(?=.*no-queue)(?=.*Skill-facing Codex executor).*"
        },
        "stderr_lines": [],
        "log_events": []
      }
    },
    {
      "run": [
        "completion",
        "powershell",
        "--no-descriptions"
      ],
      "expect": {
        "exit_code": 0,
        "stdout": {
          "$regex": "(?s)(?=.*\\bcommand\\b)(?=.*\\binstall\\b)(?=.*\\bqueue\\b)(?=.*\\bsessions\\b)(?=.*\\bupdate\\b)(?=.*\\bversion\\b)(?=.*\\bwait\\b)(?=.*\\bcodex\\b)(?=.*workdir)(?=.*no-queue)(?!.*Skill-facing Codex executor).*"
        },
        "stderr_lines": [],
        "log_events": []
      }
    },
    {
      "run": [
        "completion",
        "tcsh"
      ],
      "expect": {
        "exit_code": 0,
        "stdout": {
          "$regex": "(?s)(?=.*\\AGenerate the autocompletion script for rival for the specified shell\\.\\n)(?=.*Usage:\\s+rival\\s+completion(?![\\w-]))(?=.*\\n\\s+bash +Generate the autocompletion script for bash)(?=.*\\n\\s+zsh +Generate the autocompletion script for zsh)(?=.*\\n\\s+fish +Generate the autocompletion script for fish)(?=.*\\n\\s+powershell +Generate the autocompletion script for powershell)(?=.*(?<![\\w-])\\-h,\\ \\-\\-help(?![\\w-])[^\\n]*(?:\\n\\s*)?[^\\n]*?help for completion).*"
        },
        "stderr_lines": [],
        "log_events": []
      }
    }
  ],
  "expect": {
