{
  "name": "install-codex-force",
  "description": "`rival install --target codex --force` installs only under <HOME>/.agents/skills. An existing rival skill with 'version: old' is rewritten without a prompt ('  ✓ rival — updated (vold → v<version>)'). The 5.2.0 per-model skill rival-sol is deprecated and removed. No prompt text is printed, stdin is not read, and no .claude directory is created.",
  "fixtures": [
    {
      "write": "home/.agents/skills/rival/SKILL.md",
      "text": "---\nversion: old\n---\ncustom"
    },
    {
      "write": "home/.agents/skills/rival-sol/SKILL.md",
      "text": "---\nversion: 5.2.0\n---\nold model skill"
    }
  ],
  "normalise": [
    {
      "regex": "v(\\d+\\.\\d+\\.\\d+)",
      "kind": "replace",
      "replace": "<V>"
    }
  ],
  "steps": [
    {
      "run": [
        "install",
        "--target",
        "codex",
        "--force"
      ],
      "stdin": "",
      "expect": {
        "exit_code": 0,
        "stdout": "Installing codex skills to <HOME>/.agents/skills\n\n  ✓ rival — updated (vold → v<V>)\n  ✓ china — installed (v<V>)\n  🗑 deprecated skill removed\n\nDone: 1 installed, 1 updated, 0 up to date, 1 removed\n",
        "stderr_lines": [],
        "log_events": []
      }
    }
  ],
  "expect": {
    "home_files": [
      ".agents/skills/china/SKILL.md",
      ".agents/skills/rival/SKILL.md"
    ]
  }
}
