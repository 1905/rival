{
  "name": "install-codex-force",
  "description": "`rival install --target codex --force` installs only under <HOME>/.agents/skills. An existing rival-codex with 'version: old' is rewritten without a prompt ('  ✓ rival-codex — updated (vold → v<version>)'). The other eight skills are installed. No prompt text is printed, stdin is not read, and no .claude directory is created.",
  "fixtures": [
    {
      "write": "home/.agents/skills/rival-codex/SKILL.md",
      "text": "---\nversion: old\n---\ncustom"
    }
  ],
  "normalise": [
    {
      "regex": "v(\\d+\\.\\d+\\.\\d+)",
      "kind": "replace",
      "replace": "<V>"
    }
  ],
  "steps": [
    {
      "run": [
        "install",
        "--target",
        "codex",
        "--force"
      ],
      "stdin": "",
      "expect": {
        "exit_code": 0,
        "stdout": "Installing codex skills to <HOME>/.agents/skills\n\n  ✓ rival-codex — updated (vold → v<V>)\n  ✓ rival-sol — installed (v<V>)\n  ✓ rival-plan — installed (v<V>)\n  ✓ rival-plan-codex — installed (v<V>)\n  ✓ rival-plan-claude — installed (v<V>)\n  ✓ rival-claude — installed (v<V>)\n  ✓ rival-fable — installed (v<V>)\n  ✓ rival-k3 — installed (v<V>)\n  ✓ rival-grok — installed (v<V>)\n  ✓ rival-security — installed (v<V>)\n\nDone: 9 installed, 1 updated, 0 up to date, 0 removed\n",
        "stderr_lines": [],
        "log_events": []
      }
    }
  ],
  "expect": {
    "home_files": [
      ".agents/skills/rival-codex/SKILL.md",
      ".agents/skills/rival-sol/SKILL.md",
      ".agents/skills/rival-plan/SKILL.md",
      ".agents/skills/rival-plan-codex/SKILL.md",
      ".agents/skills/rival-plan-claude/SKILL.md",
      ".agents/skills/rival-claude/SKILL.md",
      ".agents/skills/rival-fable/SKILL.md",
      ".agents/skills/rival-k3/SKILL.md",
      ".agents/skills/rival-grok/SKILL.md",
      ".agents/skills/rival-security/SKILL.md"
    ]
  }
}
