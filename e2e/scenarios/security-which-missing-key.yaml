{
  "name": "security-which-missing-key",
  "description": "`rival command security --which` with security.reviewer = grok and no OPENROUTER_API_KEY in the env or any .env. Stdout shows the grok entry, 'Config: security.reviewer = grok', 'OPENROUTER_API_KEY: MISSING' and 'Not usable.' (opencode is on PATH, never run). Exit code 1; the error is printed once on stderr.",
  "fakes": {
    "scripts": {
      "opencode": {
        "responses": [
          {
            "argv_prefix": [],
            "stderr": "fake must not run\n",
            "exit": 97
          }
        ]
      }
    }
  },
  "env": {
    "OPENROUTER_API_KEY": null
  },
  "fixtures": [
    {
      "write": "home/.rival/config.yaml",
      "text": "security:\n  reviewer: grok\n"
    }
  ],
  "steps": [
    {
      "run": [
        "command",
        "security",
        "--which"
      ],
      "stdin": "",
      "expect": {
        "exit_code": 1,
        "stdout": "Security reviewer: grok (x-ai/grok-4.6 via openrouter)\nConfig: security.reviewer = grok\nOpenCode selector: openrouter/x-ai/grok-4.6\nReasoning variant: xhigh\nOPENROUTER_API_KEY: MISSING\n\nNot usable.\n",
        "stderr_lines": [
          "model grok-4.6-openrouter requires OPENROUTER_API_KEY — add it to the project .env or export it"
        ],
        "log_events": []
      }
    }
  ],
  "expect": {
    "home_files": [
      ".rival/config.yaml"
    ],
    "calls": {
      "opencode": 0
    }
  }
}
