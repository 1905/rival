{
  "name": "ultrafast-command",
  "description": "`rival command sol --ultrafast` and `rival command codex --ultrafast`: the tier pairs follow `-m <model>` and the session records `service_tier`. Sol's fake echoes the prompt and then prints Codex's \"not advertised\" warning, as Codex does (all on stdout, so the log order is fixed), so rival prints the not-applied notice after the output on stdout and on stderr; the run still completes. Codex's fake prints no warning, so there is no notice.",
  "fakes": {
    "scripts": {
      "codex": {
        "responses": [
          {
            "argv": [
              "login",
              "status"
            ],
            "times": 2,
            "stdout": "Logged in using ChatGPT\n",
            "exit": 0
          },
          {
            "argv": [
              "exec",
              "-C",
              "<ROOT>/work",
              "-m",
              "gpt-6.1-sol",
              "-c",
              "service_tier=\"ultrafast\"",
              "-c",
              "features.ultrafast_mode=true",
              "-c",
              "model_reasoning_effort=xhigh",
              "--sandbox",
              "read-only",
              "--ephemeral",
              "--skip-git-repo-check",
              "--color",
              "never",
              "-"
            ],
            "times": 1,
            "expect": {
              "stdin": "Answer the user's question directly. Do not offer follow-up options, menus, walkthroughs, or ask if they want more. No filler, no sign-offs. Just deliver the answer and stop.\n\nYou are working in project directory: <ROOT>/work\nUse your tools to read files, run git commands, and explore the codebase as needed.\n\nexplain the auth flow",
              "cwd": "<ROOT>/work"
            },
            "stdout": "user\nAnswer the user's question directly. Do not offer follow-up options, menus, walkthroughs, or ask if they want more. No filler, no sign-offs. Just deliver the answer and stop.\n\nYou are working in project directory: <ROOT>/work\nUse your tools to read files, run git commands, and explore the codebase as needed.\n\nexplain the auth flow\nwarning: Configured service tier `ultrafast` is not advertised as supported for model `gpt-6.1-sol` and will be omitted from requests.\ncodex\nA done\n",
            "exit": 0
          },
          {
            "argv": [
              "exec",
              "-C",
              "<ROOT>/work",
              "-m",
              "gpt-6-astra",
              "-c",
              "service_tier=\"ultrafast\"",
              "-c",
              "features.ultrafast_mode=true",
              "-c",
              "model_reasoning_effort=xhigh",
              "--sandbox",
              "read-only",
              "--ephemeral",
              "--skip-git-repo-check",
              "--color",
              "never",
              "-"
            ],
            "times": 1,
            "expect": {
              "stdin": "Answer the user's question directly. Do not offer follow-up options, menus, walkthroughs, or ask if they want more. No filler, no sign-offs. Just deliver the answer and stop.\n\nYou are working in project directory: <ROOT>/work\nUse your tools to read files, run git commands, and explore the codebase as needed.\n\nexplain the auth flow",
              "cwd": "<ROOT>/work"
            },
            "stdout": "B done\n",
            "exit": 0
          }
        ]
      }
    }
  },
  "steps": [
    {
      "run": [
        "command",
        "sol",
        "--ultrafast"
      ],
      "stdin": "explain the auth flow",
      "expect": {
        "exit_code": 0,
        "stdout": "user\nAnswer the user's question directly. Do not offer follow-up options, menus, walkthroughs, or ask if they want more. No filler, no sign-offs. Just deliver the answer and stop.\n\nYou are working in project directory: <ROOT>/work\nUse your tools to read files, run git commands, and explore the codebase as needed.\n\nexplain the auth flow\nwarning: Configured service tier `ultrafast` is not advertised as supported for model `sol` and will be omitted from requests.\ncodex\nA done\n\nrival: ⚠ ultrafast not applied — Codex omitted service_tier=ultrafast for sol because its model catalog does not list the tier; the run used the standard tier.\nrival: Ultrafast needs a Codex account on Pro $500, or an Enterprise/Edu workspace with Ultrafast on.\n",
        "stderr_lines": [
          "rival: ⚠ ultrafast not applied — Codex omitted service_tier=ultrafast for sol because its model catalog does not list the tier; the run used the standard tier.",
          "rival: Ultrafast needs a Codex account on Pro $500, or an Enterprise/Edu workspace with Ultrafast on."
        ],
        "log_events": [
          {
            "level": "info",
            "message": "starting sol (command mode)",
            "fields": {
              "session": "<UUID1>",
              "effort": "xhigh",
              "mode": "raw"
            }
          },
          {
            "level": "warn",
            "message": "codex omitted the ultrafast service tier",
            "fields": {
              "session": "<UUID1>"
            }
          }
        ]
      }
    },
    {
      "run": [
        "command",
        "codex",
        "--ultrafast"
      ],
      "stdin": "explain the auth flow",
      "expect": {
        "exit_code": 0,
        "stdout": "B done\n",
        "stderr_lines": [],
        "log_events": [
          {
            "level": "info",
            "message": "starting codex (command mode)",
            "fields": {
              "session": "<UUID2>",
              "effort": "xhigh",
              "mode": "raw"
            }
          }
        ]
      }
    }
  ],
  "expect": {
    "home_files": [
      ".rival/queue/.lock",
      ".rival/sessions/<UUID1>.json",
      ".rival/sessions/<UUID1>.log",
      ".rival/sessions/<UUID2>.json",
      ".rival/sessions/<UUID2>.log"
    ],
    "files": [
      {
        "path": "<HOME>/.rival/sessions/<UUID1>.json",
        "json": {
          "status": "completed",
          "exit_code": 0,
          "cli": "codex",
          "model": "gpt-6.1-sol",
          "service_tier": "ultrafast",
          "mode": "raw",
          "service_tier_omitted": true
        }
      },
      {
        "path": "<HOME>/.rival/sessions/<UUID2>.json",
        "json": {
          "status": "completed",
          "exit_code": 0,
          "cli": "codex",
          "model": "gpt-6-astra",
          "service_tier": "ultrafast",
          "mode": "raw"
        }
      }
    ],
    "calls": {
      "codex": 4
    }
  }
}
