{
  "name": "speed-command",
  "description": "`speed.sol` is ultrafast and `speed.codex` is normal. `rival command sol` gets the ultrafast tier pairs after `-m` and records `service_tier`; Sol's fake echoes the prompt and then prints Codex's \"not advertised\" warning, as Codex does (all on stdout, so the log order is fixed), so rival prints the ultrafast not-applied notice with the plan line after the output on stdout and on stderr, and the run still completes. `rival command codex` runs without the tier: its speed is normal. `config set speed.codex fast` (no plan warning), then `rival command codex` gets the fast tier pairs and records `service_tier: fast`.",
  "fakes": {
    "scripts": {
      "codex": {
        "responses": [
          {
            "argv": [
              "login",
              "status"
            ],
            "times": 3,
            "stdout": "Logged in using ChatGPT\n",
            "exit": 0
          },
          {
            "argv": [
              "exec",
              "-C",
              "<ROOT>/work",
              "-m",
              "gpt-6.1-sol",
              "-c",
              "service_tier=\"ultrafast\"",
              "-c",
              "features.ultrafast_mode=true",
              "-c",
              "model_reasoning_effort=xhigh",
              "--sandbox",
              "workspace-write",
              "--ephemeral",
              "--skip-git-repo-check",
              "--color",
              "never",
              "-"
            ],
            "times": 1,
            "expect": {
              "stdin": "Answer the user's question directly. Do not offer follow-up options, menus, walkthroughs, or ask if they want more. No filler, no sign-offs. Just deliver the answer and stop.\n\nYou are working in project directory: <ROOT>/work\nUse your tools to read files, run git commands, and explore the codebase as needed.\n\nexplain the auth flow",
              "cwd": "<ROOT>/work"
            },
            "stdout": "user\nAnswer the user's question directly. Do not offer follow-up options, menus, walkthroughs, or ask if they want more. No filler, no sign-offs. Just deliver the answer and stop.\n\nYou are working in project directory: <ROOT>/work\nUse your tools to read files, run git commands, and explore the codebase as needed.\n\nexplain the auth flow\nwarning: Configured service tier `ultrafast` is not advertised as supported for model `gpt-6.1-sol` and will be omitted from requests.\ncodex\nA done\n",
            "exit": 0
          },
          {
            "argv": [
              "exec",
              "-C",
              "<ROOT>/work",
              "-m",
              "gpt-6-astra",
              "-c",
              "model_reasoning_effort=xhigh",
              "--sandbox",
              "workspace-write",
              "--ephemeral",
              "--skip-git-repo-check",
              "--color",
              "never",
              "-"
            ],
            "times": 1,
            "expect": {
              "stdin": "Answer the user's question directly. Do not offer follow-up options, menus, walkthroughs, or ask if they want more. No filler, no sign-offs. Just deliver the answer and stop.\n\nYou are working in project directory: <ROOT>/work\nUse your tools to read files, run git commands, and explore the codebase as needed.\n\nexplain the auth flow",
              "cwd": "<ROOT>/work"
            },
            "stdout": "B done\n",
            "exit": 0
          },
          {
            "argv": [
              "exec",
              "-C",
              "<ROOT>/work",
              "-m",
              "gpt-6-astra",
              "-c",
              "service_tier=\"fast\"",
              "-c",
              "features.fast_mode=true",
              "-c",
              "model_reasoning_effort=xhigh",
              "--sandbox",
              "workspace-write",
              "--ephemeral",
              "--skip-git-repo-check",
              "--color",
              "never",
              "-"
            ],
            "times": 1,
            "expect": {
              "stdin": "Answer the user's question directly. Do not offer follow-up options, menus, walkthroughs, or ask if they want more. No filler, no sign-offs. Just deliver the answer and stop.\n\nYou are working in project directory: <ROOT>/work\nUse your tools to read files, run git commands, and explore the codebase as needed.\n\nexplain the auth flow",
              "cwd": "<ROOT>/work"
            },
            "stdout": "F done\n",
            "exit": 0
          }
        ]
      }
    }
  },
  "fixtures": [
    {
      "write": "home/.rival/config.yaml",
      "text": "speed:\n  sol: ultrafast\n  codex: normal\n"
    }
  ],
  "steps": [
    {
      "run": [
        "command",
        "sol"
      ],
      "stdin": "explain the auth flow",
      "expect": {
        "exit_code": 0,
        "stdout": "user\nAnswer the user's question directly. Do not offer follow-up options, menus, walkthroughs, or ask if they want more. No filler, no sign-offs. Just deliver the answer and stop.\n\nYou are working in project directory: <ROOT>/work\nUse your tools to read files, run git commands, and explore the codebase as needed.\n\nexplain the auth flow\nwarning: Configured service tier `ultrafast` is not advertised as supported for model `sol` and will be omitted from requests.\ncodex\nA done\n\nrival: ⚠ ultrafast not applied — Codex omitted service_tier=ultrafast for sol because its model catalog does not list the tier; the run used the standard tier.\nrival: Ultrafast needs the Pro $500 plan, or an Enterprise/Edu workspace with Ultrafast on.\n",
        "stderr_lines": [
          "rival: ⚠ ultrafast not applied — Codex omitted service_tier=ultrafast for sol because its model catalog does not list the tier; the run used the standard tier.",
          "rival: Ultrafast needs the Pro $500 plan, or an Enterprise/Edu workspace with Ultrafast on."
        ],
        "log_events": [
          {
            "level": "info",
            "message": "starting sol (command mode)",
            "fields": {
              "session": "<UUID1>",
              "effort": "xhigh",
              "mode": "raw"
            }
          },
          {
            "level": "warn",
            "message": "codex omitted the service tier",
            "fields": {
              "session": "<UUID1>",
              "tier": "ultrafast"
            }
          }
        ]
      }
    },
    {
      "run": [
        "command",
        "codex"
      ],
      "stdin": "explain the auth flow",
      "expect": {
        "exit_code": 0,
        "stdout": "B done\n",
        "stderr_lines": [],
        "log_events": [
          {
            "level": "info",
            "message": "starting codex (command mode)",
            "fields": {
              "session": "<UUID2>",
              "effort": "xhigh",
              "mode": "raw"
            }
          }
        ]
      }
    },
    {
      "run": [
        "config",
        "set",
        "speed.codex",
        "fast"
      ],
      "stdin": "",
      "expect": {
        "exit_code": 0,
        "stdout": "speed.codex = fast\n",
        "stderr_lines": [],
        "log_events": []
      }
    },
    {
      "run": [
        "command",
        "codex"
      ],
      "stdin": "explain the auth flow",
      "expect": {
        "exit_code": 0,
        "stdout": "F done\n",
        "stderr_lines": [],
        "log_events": [
          {
            "level": "info",
            "message": "starting codex (command mode)",
            "fields": {
              "session": "<UUID3>",
              "effort": "xhigh",
              "mode": "raw"
            }
          }
        ]
      }
    }
  ],
  "expect": {
    "home_files": [
      ".rival/config.yaml",
      ".rival/config.yaml.bak",
      ".rival/config.yaml.lock",
      ".rival/queue/.lock",
      ".rival/sessions/<UUID1>.json",
      ".rival/sessions/<UUID1>.log",
      ".rival/sessions/<UUID2>.json",
      ".rival/sessions/<UUID2>.log",
      ".rival/sessions/<UUID3>.json",
      ".rival/sessions/<UUID3>.log"
    ],
    "files": [
      {
        "path": "<HOME>/.rival/sessions/<UUID1>.json",
        "json": {
          "status": "completed",
          "exit_code": 0,
          "cli": "codex",
          "model": "gpt-6.1-sol",
          "service_tier": "ultrafast",
          "mode": "raw",
          "service_tier_omitted": true
        }
      },
      {
        "path": "<HOME>/.rival/sessions/<UUID2>.json",
        "json": {
          "status": "completed",
          "exit_code": 0,
          "cli": "codex",
          "model": "gpt-6-astra",
          "mode": "raw"
        }
      },
      {
        "path": "<HOME>/.rival/sessions/<UUID3>.json",
        "json": {
          "status": "completed",
          "exit_code": 0,
          "cli": "codex",
          "model": "gpt-6-astra",
          "mode": "raw",
          "service_tier": "fast"
        }
      },
      {
        "path": "<HOME>/.rival/config.yaml",
        "text": "# written by rival config; comments are not kept\nspeed:\n  sol: ultrafast\n  codex: fast\n"
      }
    ],
    "calls": {
      "codex": 6
    }
  }
}
