{
  "name": "executor-codex-quota",
  "description": "`rival command codex` with 'review src/' (explicit scope, no git auto-detect). The fake exits 0 with only a quota signature ('insufficient_quota'), so there is no parsed review JSON. The session fails with the quota reason, stdout keeps the public log, and the quota reason goes to stderr with exit 1. Also checks the review-mode argv and env passed to the fake.",
  "fakes": {
    "scripts": {
      "codex": {
        "responses": [
          {
            "argv": [
              "login",
              "status"
            ],
            "times": 1,
            "stdout": "Logged in using ChatGPT\n",
            "exit": 0
          },
          {
            "argv": [
              "exec",
              "-C",
              "<ROOT>/work",
              "-m",
              "gpt-6-astra",
              "-c",
              "model_reasoning_effort=xhigh",
              "--sandbox",
              "read-only",
              "--ephemeral",
              "--skip-git-repo-check",
              "--color",
              "never",
              "-"
            ],
            "times": 1,
            "expect": {
              "stdin": {
                "$regex": "(?s).*src/.*"
              },
              "cwd": "<ROOT>/work"
            },
            "stdout": "ERROR: insufficient_quota\n",
            "exit": 0
          }
        ]
      }
    }
  },
  "steps": [
    {
      "run": [
        "command",
        "codex"
      ],
      "stdin": "review src/",
      "expect": {
        "exit_code": 1,
        "stdout": "ERROR: insufficient_quota\n",
        "stderr_lines": [
          "codex hit provider quota/rate limit (429)"
        ],
        "log_events": [
          {
            "level": "info",
            "message": "starting codex (command mode)",
            "fields": {
              "session": "<UUID1>",
              "effort": "xhigh",
              "mode": "review"
            }
          }
        ]
      }
    }
  ],
  "expect": {
    "home_files": [
      ".rival/queue/.lock",
      ".rival/sessions/<UUID1>.json",
      ".rival/sessions/<UUID1>.log"
    ],
    "files": [
      {
        "path": "<HOME>/.rival/sessions/<UUID1>.json",
        "json": {
          "status": "failed",
          "exit_code": 1,
          "cli": "codex",
          "model": "gpt-6-astra",
          "effort": "xhigh",
          "mode": "review",
          "work_dir": "<ROOT>/work",
          "error": "codex hit provider quota/rate limit (429)",
          "review_scope": "src/"
        }
      },
      {
        "path": "<HOME>/.rival/sessions/<UUID1>.log",
        "text": "ERROR: insufficient_quota\n"
      }
    ],
    "calls": {
      "codex": 2
    }
  }
}
