{
  "name": "update-brew-reinstall-fallback",
  "description": "`rival update` where `brew upgrade` exits 1 (its stderr passes through). Output: 'brew upgrade failed, trying reinstall...', then `brew reinstall 1905/tap/rival` runs and succeeds; the rest is the normal upgrade path. The updater verifies the selected binary version before installing skills.",
  "normalise": [
    {
      "regex": "v(\\d+\\.\\d+\\.\\d+)",
      "kind": "replace",
      "replace": "<V>"
    }
  ],
  "fixtures": [
    {
      "write": "brew/opt/rival/bin/rival",
      "mode": "0755",
      "text": "#!/bin/sh\nif [ \"$1\" = version ]; then printf '  9.9.9\\n'; else exec '<BIN>' \"$@\"; fi\n"
    }
  ],
  "fakes": {
    "scripts": {
      "brew": {
        "responses": [
          {
            "argv": [
              "upgrade",
              "1905/tap/rival"
            ],
            "times": 1,
            "stderr": "Error: rival is already installed\n",
            "exit": 1
          },
          {
            "argv": [
              "reinstall",
              "1905/tap/rival"
            ],
            "times": 1,
            "stdout": "==> Reinstalling 1905/tap/rival\n",
            "exit": 0
          },
          {
            "argv": [
              "--prefix",
              "rival"
            ],
            "times": 1,
            "stdout": "<ROOT>/brew/opt/rival\n",
            "exit": 0
          }
        ]
      }
    }
  },
  "steps": [
    {
      "run": [
        "update"
      ],
      "expect": {
        "exit_code": 0,
        "stdout": "Checking for updates... vdev → v<V>\n\nUpgrading via Homebrew...\nbrew upgrade failed, trying reinstall...\n==> Reinstalling 1905/tap/rival\n\nUpdating skills...\nInstalling claude skills to <HOME>/.claude/skills\n\n  ✓ rival — installed (v<V>)\n  ✓ china — installed (v<V>)\n\nDone: 2 installed, 0 updated, 0 up to date, 0 removed\nInstalling codex skills to <HOME>/.agents/skills\n\n  ✓ rival — installed (v<V>)\n  ✓ china — installed (v<V>)\n\nDone: 2 installed, 0 updated, 0 up to date, 0 removed\n\n✓ Updated to v<V>\n",
        "stderr_lines": [
          "Error: rival is already installed"
        ],
        "log_events": []
      }
    }
  ],
  "expect": {
    "home_files": [
      ".agents/skills/china/SKILL.md",
      ".agents/skills/rival/SKILL.md",
      ".claude/skills/china/SKILL.md",
      ".claude/skills/rival/SKILL.md"
    ],
    "calls": {
      "brew": 3
    },
    "http_requests": [
      {
        "method": "GET",
        "path": "/repos/1905/rival/releases/latest"
      }
    ]
  },
  "update_server": {
    "routes": {
      "/repos/1905/rival/releases/latest": {
        "status": 200,
        "json": {
          "tag_name": "v9.9.9"
        }
      }
    }
  }
}
