{
  "name": "install-all-prompts",
  "description": "`rival install --target all` with stdin 'n\\nYES\\n': Claude skills are processed first, then Codex, both reading one shared stdin. The Claude rival skill (version old) is declined and printed as skipped, counted as up to date; the declined file keeps its text. The Codex rival skill has no frontmatter so its version is 'unknown'; 'YES' is accepted case-insensitively and it is updated. The 5.2.0 per-model skill rival-codex is deprecated and removed.",
  "fixtures": [
    {
      "write": "home/.claude/skills/rival/SKILL.md",
      "text": "---\nversion: old\n---\nclaude custom"
    },
    {
      "write": "home/.claude/skills/rival-codex/SKILL.md",
      "text": "---\nversion: 5.2.0\n---\nold model skill"
    },
    {
      "write": "home/.agents/skills/rival/SKILL.md",
      "text": "no frontmatter"
    }
  ],
  "normalise": [
    {
      "regex": "v(\\d+\\.\\d+\\.\\d+)",
      "kind": "replace",
      "replace": "<V>"
    }
  ],
  "steps": [
    {
      "run": [
        "install",
        "--target",
        "all"
      ],
      "stdin": "n\nYES\n",
      "expect": {
        "exit_code": 0,
        "stdout": "Installing claude skills to <HOME>/.claude/skills\n\n  ? rival — update vold → v<V>? [y/N]     skipped\n  🗑 deprecated skill removed\n\nDone: 0 installed, 0 updated, 1 up to date, 1 removed\nInstalling codex skills to <HOME>/.agents/skills\n\n  ? rival — update vunknown → v<V>? [y/N]   ✓ rival — updated (vunknown → v<V>)\n\nDone: 0 installed, 1 updated, 0 up to date, 0 removed\n",
        "stderr_lines": [],
        "log_events": []
      }
    }
  ],
  "expect": {
    "home_files": [
      ".claude/skills/rival/SKILL.md",
      ".agents/skills/rival/SKILL.md"
    ],
    "files": [
      {
        "path": "<HOME>/.claude/skills/rival/SKILL.md",
        "text": "---\nversion: old\n---\nclaude custom"
      }
    ]
  }
}
