{
  "name": "config-check-fail-exit",
  "description": "`rival config check` with no proxy and the default models: codex, sol, claude, fable and china. Codex and Sol pass through the real codex adapter (preflight `codex login status`, then a read-only exec at low effort in ~/.rival/check). Claude and Fable fail as not installed (no claude, no docker) and never run; China fails as not installed (no opencode) and never runs. The text table is in model order and the command exits 1. No session is saved and no queue slot is taken: home has only the two check logs (one `check/<name>-<pid>-<id>.log` per run).",
  "fakes": {
    "absent": [
      "claude",
      "docker",
      "opencode"
    ],
    "scripts": {
      "codex": {
        "responses": [
          {
            "argv": [
              "login",
              "status"
            ],
            "times": 2,
            "stdout": "Logged in using ChatGPT\n",
            "exit": 0
          },
          {
            "argv_prefix": [
              "exec",
              "-C",
              "<HOME>/.rival/check",
              "-m",
              "gpt-6-astra",
              "-c",
              "service_tier=\"fast\"",
              "-c",
              "features.fast_mode=true",
              "-c",
              "model_reasoning_effort=low",
              "--sandbox",
              "read-only"
            ],
            "times": 1,
            "expect": {
              "stdin": {
                "$regex": "(?s:.*)\nReply with exactly: ok"
              },
              "cwd": "<HOME>/.rival/check"
            },
            "stdout": "ok\n",
            "exit": 0
          },
          {
            "argv_prefix": [
              "exec",
              "-C",
              "<HOME>/.rival/check",
              "-m",
              "gpt-6.1-sol",
              "-c",
              "service_tier=\"fast\"",
              "-c",
              "features.fast_mode=true",
              "-c",
              "model_reasoning_effort=low",
              "--sandbox",
              "read-only"
            ],
            "times": 1,
            "expect": {
              "stdin": {
                "$regex": "(?s:.*)\nReply with exactly: ok"
              },
              "cwd": "<HOME>/.rival/check"
            },
            "stdout": "ok\n",
            "exit": 0
          }
        ]
      }
    }
  },
  "normalise": [
    {
      "regex": " ([0-9]+\\.[0-9]s) ",
      "kind": "duration"
    },
    {
      "regex": "check/[^/\\s\"]+-([0-9]+-[0-9a-f]{32})\\.log",
      "kind": "replace",
      "replace": "<RUN>"
    }
  ],
  "steps": [
    {
      "run": [
        "config",
        "check"
      ],
      "expect": {
        "exit_code": 1,
        "stdout": "proxy  off\n\n  ✓ codex   direct  gpt-6-astra             <DURATION>  ok  [fast]\n  ✓ sol     direct  gpt-6.1-sol             <DURATION>  ok  [fast]\n  ✗ claude  direct  claude-opus-5-5         —     not installed\n  ✗ fable   direct  claude-fable-5-1        —     not installed\n  ✗ china   direct  moonshot/kimi-k3.1-pro  —     not installed\n\n2 of 5 ok\n",
        "stderr_lines": [
          "config check: 3 of 5 models failed"
        ]
      }
    }
  ],
  "expect": {
    "home_files": [
      ".rival/check/codex-<RUN>.log",
      ".rival/check/sol-<RUN>.log"
    ],
    "files": [
      {
        "path": "<HOME>/.rival/check/codex-<RUN>.log",
        "text": "ok\n"
      }
    ],
    "calls": {
      "codex": 4
    }
  }
}
