{
  "name": "config-check-fail-exit",
  "description": "`rival config check` with no proxy and the default models: codex, sol, claude, fable and the security reviewer (k3). Codex and Sol pass through the real codex adapter (preflight `codex login status`, then a read-only exec at low effort in ~/.rival/check). Claude and Fable fail as not installed (no claude, no docker) and never run; K3 fails its preflight (no MOONSHOT_API_KEY) and opencode never runs. The text table is in model order and the command exits 1. No session is saved and no queue slot is taken: home has only the two check logs.",
  "fakes": {
    "absent": [
      "claude",
      "docker"
    ],
    "scripts": {
      "codex": {
        "responses": [
          {
            "argv": [
              "login",
              "status"
            ],
            "times": 2,
            "stdout": "Logged in using ChatGPT\n",
            "exit": 0
          },
          {
            "argv_prefix": [
              "exec",
              "-C",
              "<HOME>/.rival/check",
              "-m",
              "gpt-6-astra",
              "-c",
              "model_reasoning_effort=low",
              "--sandbox",
              "read-only"
            ],
            "times": 1,
            "expect": {
              "stdin": {
                "$regex": "(?s:.*)\nReply with exactly: ok"
              },
              "cwd": "<HOME>/.rival/check"
            },
            "stdout": "ok\n",
            "exit": 0
          },
          {
            "argv_prefix": [
              "exec",
              "-C",
              "<HOME>/.rival/check",
              "-m",
              "gpt-6.1-sol",
              "-c",
              "model_reasoning_effort=low",
              "--sandbox",
              "read-only"
            ],
            "times": 1,
            "expect": {
              "stdin": {
                "$regex": "(?s:.*)\nReply with exactly: ok"
              },
              "cwd": "<HOME>/.rival/check"
            },
            "stdout": "ok\n",
            "exit": 0
          }
        ]
      }
    }
  },
  "normalise": [
    {
      "regex": " ([0-9]+\\.[0-9]s) ",
      "kind": "duration"
    }
  ],
  "steps": [
    {
      "run": [
        "config",
        "check"
      ],
      "expect": {
        "exit_code": 1,
        "stdout": "proxy  off\n\n  ✓ codex   direct  gpt-6-astra         <DURATION>  ok\n  ✓ sol     direct  gpt-6.1-sol         <DURATION>  ok\n  ✗ claude  direct  claude-opus-5-5     —     not installed\n  ✗ fable   direct  claude-fable-5-1    —     not installed\n  ✗ k3      direct  moonshotai/kimi-k3  —     MOONSHOT_API_KEY is not set — add it to the project .env or export it\n\n2 of 5 ok\n",
        "stderr_lines": [
          "config check: 3 of 5 models failed"
        ]
      }
    }
  ],
  "expect": {
    "home_files": [
      ".rival/check/codex.log",
      ".rival/check/sol.log"
    ],
    "files": [
      {
        "path": "<HOME>/.rival/check/codex.log",
        "text": "ok\n"
      }
    ],
    "calls": {
      "codex": 4
    }
  }
}
