{
  "name": "proxy-off-env",
  "description": "RIVAL_PROXY=off sends one run direct although the config enables proxy.claude: no /v1/models call, the bare model id, the subscription env rules (CLAUDECODE, ANTHROPIC_API_KEY and ANTHROPIC_AUTH_TOKEN removed), no proxy variables, account subscription.",
  "fakes": {
    "scripts": {
      "claude": {
        "responses": [
          {
            "argv": [
              "-p",
              "--model",
              "claude-opus-5-5",
              "--effort",
              "medium",
              "--output-format",
              "text",
              "--no-session-persistence",
              "--system-prompt",
              "Answer the user's question directly. Do not offer follow-up options, menus, walkthroughs, or ask if they want more. No filler, no sign-offs. Just deliver the answer and stop.",
              "--dangerously-skip-permissions"
            ],
            "times": 1,
            "expect": {
              "stdin": "You are working in project directory: <ROOT>/work\nUse your tools to read files, run git commands, and explore the codebase as needed.\n\nexplain the auth flow",
              "cwd": "<ROOT>/work",
              "env": {
                "CLAUDECODE": null,
                "ANTHROPIC_API_KEY": null,
                "ANTHROPIC_AUTH_TOKEN": null
              }
            },
            "stdout": "A done\n",
            "exit": 0
          }
        ]
      }
    }
  },
  "env": {
    "CLAUDECODE": "1",
    "ANTHROPIC_API_KEY": "sk-parity-must-not-leak",
    "ANTHROPIC_AUTH_TOKEN": "sk-parity-token-must-not-leak",
    "RIVAL_PROXY_URL": "<SERVER>",
    "RIVAL_PROXY_KEY": "test-proxy-key-0000",
    "RIVAL_PROXY": "off"
  },
  "fixtures": [
    {
      "write": "home/.rival/config.yaml",
      "text": "proxy:\n  claude:\n    enabled: true\n    model_prefix: emcd_\n"
    }
  ],
  "update_server": {
    "routes": {
      "/v1/models": {
        "status": 200,
        "auth": "Bearer test-proxy-key-0000",
        "json": {
          "object": "list",
          "data": [
            {
              "id": "emcd_/claude-opus-5-5",
              "owned_by": "anthropic"
            },
            {
              "id": "emcd2_/claude-opus-5-5",
              "owned_by": "anthropic"
            },
            {
              "id": "gpt-6-astra",
              "owned_by": "openai"
            }
          ]
        }
      }
    }
  },
  "steps": [
    {
      "run": [
        "command",
        "claude"
      ],
      "stdin": "explain the auth flow",
      "expect": {
        "exit_code": 0,
        "stdout": "A done\n",
        "stderr_lines": [],
        "log_events": [
          {
            "level": "info",
            "message": "starting claude (command mode)",
            "fields": {
              "session": "<UUID1>",
              "effort": "medium",
              "mode": "raw"
            }
          },
          {
            "level": "info",
            "message": "model native auth mode",
            "fields": {
              "session": "<UUID1>",
              "auth": "subscription",
              "model": "claude"
            }
          }
        ]
      }
    }
  ],
  "expect": {
    "home_files": [
      ".rival/config.yaml",
      ".rival/queue/.lock",
      ".rival/sessions/<UUID1>.json",
      ".rival/sessions/<UUID1>.log"
    ],
    "files": [
      {
        "path": "<HOME>/.rival/sessions/<UUID1>.json",
        "json": {
          "status": "completed",
          "exit_code": 0,
          "model": "claude-opus-5-5",
          "mode": "native",
          "account": "subscription"
        }
      },
      {
        "path": "<HOME>/.rival/sessions/<UUID1>.log",
        "text": "A done\n"
      }
    ],
    "calls": {
      "claude": 1
    }
  }
}
