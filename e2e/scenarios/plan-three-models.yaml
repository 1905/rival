{
  "name": "plan-three-models",
  "description": "`rival command plan -m opus,fable,sol` with both proxy routes on: proxy.claude with prefix emcd_ and proxy.codex with no prefix. `opus` names Claude (Opus 5.5). Opus and Fable run on the fake claude as two blocks with wire ids emcd_/claude-opus-5-5 and emcd_/claude-fable-5-1 (ANTHROPIC_BASE_URL and ANTHROPIC_API_KEY in the env); Sol runs on the fake codex with -m gpt-6.1-sol and the provider -c values, RIVAL_PROXY_KEY in the env and no `codex login status`. Each block's language repair pass runs on its own model at low effort. The preflights share one GET /v1/models. Each session keeps its bare model id and records route proxy and its wire_model.",
