  "env": {
    "RIVAL_PROXY_URL": "<SERVER>",
    "RIVAL_PROXY_KEY": "test-proxy-key-0000",
    "CLAUDECODE": "1"
  },
  "fixtures": [
    {
      "write": "home/.rival/config.yaml",
      "text": "proxy:\n  claude:\n    enabled: true\n    model_prefix: emcd_\n  codex:\n    enabled: true\n"
    },
    {
      "write": "work/plan.md",
      "text": "# Plan\n\nAdd a column, then ship.\n"
    }
  ],
  "update_server": {
    "routes": {
      "/v1/models": {
        "status": 200,
        "auth": "Bearer test-proxy-key-0000",
        "json": {
          "object": "list",
          "data": [
            {
              "id": "emcd_/claude-opus-5-5",
              "owned_by": "anthropic"
            },
            {
              "id": "emcd_/claude-fable-5-1",
              "owned_by": "anthropic"
            },
            {
              "id": "gpt-6-astra",
              "owned_by": "openai"
            },
            {
              "id": "gpt-6.1-sol",
              "owned_by": "openai"
            }
          ]
        }
      }
    }
  },
  "steps": [
    {
      "run": [
        "command",
        "plan",
        "-m",
        "opus,fable,sol"
      ],
      "stdin": "plan.md",
      "expect": {
        "exit_code": 0,
        "stdout": "\n═══ RIVAL PLAN REVIEW (claude + fable + sol) ═══\n\nFile: <ROOT>/work/plan.md\n\n── claude ──\n\nRating: 8/10\n\nSummary: The claude review finds no gap.\n\nNo bugs or gaps found.\n\n\n── fable ──\n\nRating: 7/10\n\nSummary: The fable review finds no gap.\n\nNo bugs or gaps found.\n\n\n── sol ──\n\nRating: 6/10\n\nSummary: The sol review finds no gap.\n\nNo bugs or gaps found.\n",
