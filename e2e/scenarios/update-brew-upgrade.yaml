{
  "name": "update-brew-upgrade",
  "description": "`rival update` with release tag v9.9.9 on a dev build. Output: 'vdev → v9.9.9' and a blank line, 'Upgrading via Homebrew...', `brew upgrade 1905/tap/rival` with brew's stdout/stderr on the terminal, '\\nUpdating skills...', then `brew --prefix rival` (its stderr is not shown). It then runs <prefix>/bin/rival install --target auto (a wrapper that reports the candidate version and delegates installation to the binary under test) with the same stdio, and ends with '\\n✓ Updated to v9.9.9'. The child's own update check is skipped by CI=1. The updater verifies the selected binary version before installing skills.",
  "normalise": [
    {
      "regex": "v(\\d+\\.\\d+\\.\\d+)",
      "kind": "replace",
      "replace": "<V>"
    }
  ],
  "fixtures": [
    {
      "write": "brew/opt/rival/bin/rival",
      "mode": "0755",
      "text": "#!/bin/sh\nif [ \"$1\" = version ]; then printf '  9.9.9\\n'; else exec '<BIN>' \"$@\"; fi\n"
    }
  ],
  "fakes": {
    "scripts": {
      "brew": {
        "responses": [
          {
            "argv": [
              "upgrade",
              "1905/tap/rival"
            ],
            "times": 1,
            "stdout": "==> Upgrading 1905/tap/rival\n",
            "exit": 0
          },
          {
            "argv": [
              "--prefix",
              "rival"
            ],
            "times": 1,
            "stdout": "<ROOT>/brew/opt/rival\n",
            "stderr": "prefix noise\n",
            "exit": 0
          }
        ]
      }
    }
  },
  "steps": [
    {
      "run": [
        "update"
      ],
      "expect": {
        "exit_code": 0,
        "stdout": "Checking for updates... vdev → v<V>\n\nUpgrading via Homebrew...\n==> Upgrading 1905/tap/rival\n\nUpdating skills...\nInstalling claude skills to <HOME>/.claude/skills\n\n  ✓ rival-codex — installed (v<V>)\n  ✓ rival-sol — installed (v<V>)\n  ✓ rival-astra-ultrafast — installed (v<V>)\n  ✓ rival-sol-ultrafast — installed (v<V>)\n  ✓ rival-claude — installed (v<V>)\n  ✓ rival-fable — installed (v<V>)\n  ✓ rival-k3 — installed (v<V>)\n  ✓ rival-grok — installed (v<V>)\n  ✓ rival-security — installed (v<V>)\n\nDone: 9 installed, 0 updated, 0 up to date, 0 removed\nInstalling codex skills to <HOME>/.agents/skills\n\n  ✓ rival-codex — installed (v<V>)\n  ✓ rival-sol — installed (v<V>)\n  ✓ rival-astra-ultrafast — installed (v<V>)\n  ✓ rival-sol-ultrafast — installed (v<V>)\n  ✓ rival-claude — installed (v<V>)\n  ✓ rival-fable — installed (v<V>)\n  ✓ rival-k3 — installed (v<V>)\n  ✓ rival-grok — installed (v<V>)\n  ✓ rival-security — installed (v<V>)\n\nDone: 9 installed, 0 updated, 0 up to date, 0 removed\n\n✓ Updated to v<V>\n",
        "stderr_lines": [],
        "log_events": []
      }
    }
  ],
  "expect": {
    "home_files": [
      ".claude/skills/rival-codex/SKILL.md",
      ".claude/skills/rival-sol/SKILL.md",
      ".claude/skills/rival-astra-ultrafast/SKILL.md",
      ".claude/skills/rival-sol-ultrafast/SKILL.md",
      ".claude/skills/rival-claude/SKILL.md",
      ".claude/skills/rival-fable/SKILL.md",
      ".claude/skills/rival-k3/SKILL.md",
      ".claude/skills/rival-grok/SKILL.md",
      ".claude/skills/rival-security/SKILL.md",
      ".agents/skills/rival-codex/SKILL.md",
      ".agents/skills/rival-sol/SKILL.md",
      ".agents/skills/rival-astra-ultrafast/SKILL.md",
      ".agents/skills/rival-sol-ultrafast/SKILL.md",
      ".agents/skills/rival-claude/SKILL.md",
      ".agents/skills/rival-fable/SKILL.md",
      ".agents/skills/rival-k3/SKILL.md",
      ".agents/skills/rival-grok/SKILL.md",
      ".agents/skills/rival-security/SKILL.md"
    ],
    "calls": {
      "brew": 2
    },
    "http_requests": [
      {
        "method": "GET",
        "path": "/repos/1905/rival/releases/latest"
      }
    ]
  },
  "update_server": {
    "routes": {
      "/repos/1905/rival/releases/latest": {
        "status": 200,
        "json": {
          "tag_name": "v9.9.9"
        }
      }
    }
  }
}
