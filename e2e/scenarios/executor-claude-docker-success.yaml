{
  "name": "executor-claude-docker-success",
  "description": "`rival command claude` raw prompt with a fake provider that exits 0, no claude on PATH (Docker runtime, RIVAL_CLAUDE_TOKEN set). The scenario pins the exact argv, stdin, cwd and env. The plain log ('A done') reaches stdout unchanged, the session completes, exit 0.",
  "fakes": {
    "scripts": {
      "docker": {
        "responses": [
          {
            "argv": [
              "info"
            ],
            "times": 1,
            "stdout": "Server Version: fake\n",
            "exit": 0
          },
          {
            "argv": [
              "image",
              "inspect",
              "rival-claude"
            ],
            "times": 1,
            "stdout": "[{}]\n",
            "exit": 0
          },
          {
            "argv": [
              "run",
              "--rm",
              "-i",
              "--name",
              {
                "$regex": "rival-[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}"
              },
              "-v",
              "<ROOT>/work:/workspace",
              "-w",
              "/workspace",
              "-e",
              "ANTHROPIC_AUTH_TOKEN=fixture-token",
              "rival-claude",
              "-p",
              "--model",
              "claude-opus-5-5",
              "--effort",
              "medium",
              "--output-format",
              "text",
              "--no-session-persistence",
              "--system-prompt",
              "Answer the user's question directly. Do not offer follow-up options, menus, walkthroughs, or ask if they want more. No filler, no sign-offs. Just deliver the answer and stop.",
              "--dangerously-skip-permissions"
            ],
            "times": 1,
            "expect": {
              "stdin": "You are working in project directory: <ROOT>/work\nUse your tools to read files, run git commands, and explore the codebase as needed.\n\nexplain the auth flow",
              "cwd": "<ROOT>/work"
            },
            "stdout": "A done\n",
            "exit": 0
          }
        ]
      }
    },
    "absent": [
      "claude"
    ]
  },
  "env": {
    "RIVAL_CLAUDE_TOKEN": "fixture-token"
  },
  "steps": [
    {
      "run": [
        "command",
        "claude"
      ],
      "stdin": "explain the auth flow",
      "expect": {
        "exit_code": 0,
        "stdout": "A done\n",
        "stderr_lines": [],
        "log_events": [
          {
            "level": "info",
            "message": "starting claude (command mode)",
            "fields": {
              "session": "<UUID1>",
              "effort": "medium",
              "mode": "raw"
            }
          }
        ]
      }
    }
  ],
  "expect": {
    "home_files": [
      ".rival/queue/.lock",
      ".rival/sessions/<UUID1>.json",
      ".rival/sessions/<UUID1>.log"
    ],
    "files": [
      {
        "path": "<HOME>/.rival/sessions/<UUID1>.json",
        "json": {
          "status": "completed",
          "exit_code": 0,
          "cli": "claude",
          "model": "claude-opus-5-5",
          "effort": "medium",
          "mode": "docker",
          "work_dir": "<ROOT>/work",
          "output_bytes": 7,
          "output_lines": 1
        }
      },
      {
        "path": "<HOME>/.rival/sessions/<UUID1>.log",
        "text": "A done\n"
      }
    ],
    "calls": {
      "docker": 3
    }
  }
}
