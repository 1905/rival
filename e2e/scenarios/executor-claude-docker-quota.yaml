{
  "name": "executor-claude-docker-quota",
  "description": "`rival command claude` with stdin 'review src/' (explicit scope, no git auto-detect), no claude on PATH (Docker runtime, RIVAL_CLAUDE_TOKEN set). The fake exits 0 with only an 'insufficient_quota' signature and no parsed review JSON. The session fails with the quota reason, stdout keeps the log ('ERROR: insufficient_quota'), stderr shows 'claude hit provider quota/rate limit (429)', exit 1. The scenario also pins the review-mode argv and env.",
  "fakes": {
    "scripts": {
      "docker": {
        "responses": [
          {
            "argv": [
              "info"
            ],
            "times": 1,
            "stdout": "Server Version: fake\n",
            "exit": 0
          },
          {
            "argv": [
              "image",
              "inspect",
              "rival-claude"
            ],
            "times": 1,
            "stdout": "[{}]\n",
            "exit": 0
          },
          {
            "argv": [
              "run",
              "--rm",
              "-i",
              "--name",
              {
                "$regex": "rival-[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}"
              },
              "-v",
              "<ROOT>/work:/workspace:ro",
              "-w",
              "/workspace",
              "-e",
              "ANTHROPIC_AUTH_TOKEN=fixture-token",
              "rival-claude",
              "-p",
              "--model",
              "claude-opus-5-5",
              "--effort",
              "medium",
              "--output-format",
              "text",
              "--no-session-persistence",
              "--system-prompt",
              "Answer the user's question directly. Do not offer follow-up options, menus, walkthroughs, or ask if they want more. No filler, no sign-offs. Just deliver the answer and stop.",
              "--safe-mode",
              "--setting-sources",
              "",
              "--settings",
              "{\"disableAllHooks\":true}",
              "--strict-mcp-config",
              "--mcp-config",
              "{\"mcpServers\":{}}",
              "--tools",
              "Read,Glob,Grep",
              "--allowedTools",
              "Read,Glob,Grep",
              "--disallowedTools",
              "mcp__*",
              "--permission-mode",
              "dontAsk"
            ],
            "times": 1,
            "expect": {
              "stdin": {
                "$regex": "(?s).*src/.*"
              },
              "cwd": "<ROOT>/work"
            },
            "stdout": "ERROR: insufficient_quota\n",
            "exit": 0
          }
        ]
      }
    },
    "absent": [
      "claude"
    ]
  },
  "env": {
    "RIVAL_CLAUDE_TOKEN": "fixture-token"
  },
  "steps": [
    {
      "run": [
        "command",
        "claude"
      ],
      "stdin": "review src/",
      "expect": {
        "exit_code": 1,
        "stdout": "ERROR: insufficient_quota\n",
        "stderr_lines": [
          "claude hit provider quota/rate limit (429)"
        ],
        "log_events": [
          {
            "level": "info",
            "message": "starting claude (command mode)",
            "fields": {
              "session": "<UUID1>",
              "effort": "medium",
              "mode": "review"
            }
          }
        ]
      }
    }
  ],
  "expect": {
    "home_files": [
      ".rival/queue/.lock",
      ".rival/sessions/<UUID1>.json",
      ".rival/sessions/<UUID1>.log"
    ],
    "files": [
      {
        "path": "<HOME>/.rival/sessions/<UUID1>.json",
        "json": {
          "status": "failed",
          "exit_code": 1,
          "cli": "claude",
          "model": "claude-opus-5-5",
          "effort": "medium",
          "mode": "docker",
          "work_dir": "<ROOT>/work",
          "error": "claude hit provider quota/rate limit (429)",
          "review_scope": "src/"
        }
      },
      {
        "path": "<HOME>/.rival/sessions/<UUID1>.log",
        "text": "ERROR: insufficient_quota\n"
      }
    ],
    "calls": {
      "docker": 3
    }
  }
}
